<style>
/* Hallmark · genre: editorial · macrostructure: Workbench (app shell) · theme: current atlas (tokens.css) · design-system: DESIGN.md
 * Four treatments of one catalog: curated previews, seven families and three views.
 * Read beside the catalog on desktop, in a modal on mobile,
 * and never leave the shelf: the dossier opens BESIDE the catalog, not over it. One color
 * travels through all of it. Tokens, idioms and the slider recipe are the main page's own. */
*{ box-sizing:border-box; margin:0 }
html,body{ height:100%; overflow-x:clip }
body{ overflow:hidden; background:var(--paper); color:var(--ink); font:500 var(--t2)/1.45 var(--f); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility }
button,input,select{ font:inherit; color:inherit }
button{ padding:0; border:0; background:none; cursor:pointer }
button:active{ opacity:.75 }
button:disabled{ cursor:default }
a{ color:inherit; text-decoration-thickness:1px; text-decoration-color:var(--ul); text-underline-offset:3px }
a:hover{ text-decoration-color:currentColor }
:focus-visible{ outline:2px solid var(--ink); outline-offset:2px }
input:focus-visible{ outline:none }
[hidden]{ display:none!important }
.tnum{ font-variant-numeric:tabular-nums }
code{ font-family:var(--font-mono); font-size:.88em; background:var(--panel); padding:.08em .3em }
mark{ background:color-mix(in oklab, var(--c) 30%, transparent); color:inherit; padding:0 .04em }
::selection{ background:var(--ink); color:var(--paper) }
.sw-scroll{ scrollbar-width:thin; scrollbar-color:color-mix(in oklab, var(--ink) 22%, transparent) transparent }

.app{ display:grid; height:100dvh }
.app.nopane .pane{ display:none }
.app.focus .cat{ display:none }

/* ── header: identity · the current color · search · view tools ── */
.top{ grid-area:top; position:relative; z-index:var(--z-sticky); display:flex; align-items:center; gap:var(--s4); min-height:3.5rem; padding:var(--s2) var(--s4); border-bottom:.25em solid var(--cur,var(--ink)); background:var(--paper) }   /* the main page's hueline: the rule under the header WEARS the current color */
.brand{ display:flex; flex:none; align-items:baseline; gap:var(--s2); color:var(--ink); text-decoration:none; white-space:nowrap }
.brand b{ font-size:var(--t3); font-weight:800; letter-spacing:-.01em }
.brand .n{ color:var(--soft); font-size:var(--t2); font-weight:500 }
/* the current color: the picker rhombus (the slider tick, grown up), a live value that reads
   any CSS color or any space's coordinates, and the tightest gamut that holds it */
.cur{ display:flex; flex:none; align-items:center; gap:var(--s2); height:2.25rem; padding:0 var(--s3) 0 var(--s2); background:var(--panel) }
.cdw{ position:relative; flex:none; width:22px; height:22px; display:grid; place-items:center }
.cdw::before{ content:''; grid-area:1/1; width:13px; height:13px; background:var(--cur,#f67d4f); border:1.2px solid var(--paper); box-shadow:0 0 0 1.2px var(--ink); transform:rotate(45deg); pointer-events:none; transition:transform var(--dur-micro) var(--ease-out) }
.cdw:hover::before{ transform:rotate(45deg) scale(1.12) }
.cdw input{ position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; opacity:0; cursor:pointer }
#cval{ width:7.5ch; min-width:0; border:0; background:none; outline:none; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink) }
@supports(field-sizing:content){ #cval{ field-sizing:content; width:auto; min-width:7.5ch; max-width:22rem } }
#cval[aria-invalid="true"]{ color:var(--color-error) }
.gam{ flex:none; font-size:var(--t0); font-weight:800; color:var(--soft); border:1px solid var(--hair); padding:.12em .42em; line-height:1.1; white-space:nowrap; cursor:help }
.gam[data-g="clip"]{ color:var(--color-error); border-color:currentColor }
/* search is the page's second door, so it is a field, not an icon */
.find{ position:relative; flex:1 1 18rem; display:flex; align-items:center; gap:var(--s2); min-width:10rem; max-width:34rem; height:2.25rem; padding:0 var(--s2) 0 var(--s3); background:var(--panel); color:var(--soft); cursor:text }
.find:focus-within{ background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--ink) }
.find svg{ flex:none; width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round }
.find input{ flex:1; min-width:0; border:0; background:none; outline:none; font-weight:500; color:var(--ink) }
.find input::placeholder{ color:var(--soft); opacity:1 }
.find input::-webkit-search-cancel-button{ -webkit-appearance:none; appearance:none }
.find kbd{ flex:none; padding:.1em .45em; border:1px solid var(--hair); font:600 var(--t0)/1.3 var(--f); color:var(--soft) }
.find .qx{ display:none; flex:none; width:20px; height:20px; place-items:center; color:var(--soft) }
.find.has .qx{ display:grid } .find.has kbd{ display:none }
.find .qx:hover{ color:var(--ink) }
/* segmented icon groups – rendering lens and view; the active one carries the CURRENT color
   as its underline, the main page's tab idiom */
.seg{ display:flex; align-items:center; gap:2px }
.seg button{ display:grid; width:30px; height:30px; place-items:center; color:var(--soft); border-bottom:var(--ulw) solid transparent; transition:color var(--dur-micro) var(--ease-out) }
.seg button:hover{ color:var(--ink) }
.seg button[aria-pressed="true"]{ color:var(--ink); border-bottom-color:var(--cur,var(--ink)) }
.seg svg{ width:16px; height:16px }
.ib{ display:grid; flex:none; width:32px; height:32px; place-items:center; color:var(--soft); font-weight:700; text-decoration:none }
.ib:hover,.ib[aria-pressed="true"]{ color:var(--ink) }
.ib svg{ width:16px; height:16px }

.cn{ flex:none; display:inline-flex; align-items:center; justify-content:center; min-width:1.5em; height:1.5em; padding:0 .45em; border-radius:999px; font-size:var(--t0); font-weight:800; color:var(--body); background:color-mix(in oklab, var(--ink) 6%, transparent) }   /* body ink, not soft: a 10px count on the rail's tint must still clear 4.5:1 */

/* ── the filter bar: every facet as its own quiet selector (alt's top bar) – a select that is
   unset shows only its question; set, it shows the answer, inked and underlined in the
   current color ── */
.bar{ grid-area:bar; display:flex; align-items:center; gap:var(--s4); min-height:2.75rem; padding:0 var(--s4); overflow-x:auto; border-bottom:1px solid var(--hair); scrollbar-width:none }
.bar::-webkit-scrollbar{ display:none }
.bar .cnt{ flex:none; font-weight:700; white-space:nowrap }
.bar .cnt i{ font-style:normal; font-weight:500; color:var(--soft) }
.fsel{ flex:none; field-sizing:content; max-width:12rem; padding:var(--s1) 0 2px; border:0; border-bottom:var(--ulw) solid transparent; background:none; color:var(--soft); font-size:var(--t1); font-weight:600; cursor:pointer }
.fsel:hover,.fsel:focus-visible{ color:var(--ink); outline:none }
.fsel.on{ color:var(--ink); border-bottom-color:var(--cur,var(--ink)) }
.fsel option{ color:var(--ink); background:var(--paper) }
.bar .sp{ flex:1; min-width:var(--s2) }
.bar .clr{ flex:none; color:var(--soft); font-size:var(--t1); font-weight:700; white-space:nowrap }
.bar .clr:hover{ color:var(--ink) }
.arr{ display:flex; flex:none; align-items:center; gap:var(--s1); color:var(--soft); font-size:var(--t1); font-weight:600; white-space:nowrap }

/* ── the catalog ── */
.cat{ grid-area:cat; min-height:0; overflow:auto; overscroll-behavior:contain; padding:0 var(--s5) var(--s12) }
.shelf{ padding-top:var(--s4) }
.shelf>h2{ position:sticky; top:0; z-index:3; display:flex; align-items:baseline; gap:var(--s2); margin:0 calc(-1*var(--s5)); padding:var(--s3) var(--s5) var(--s2); background:color-mix(in oklab, var(--paper) 90%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); font-size:var(--t3); font-weight:800; letter-spacing:-.01em }
.shelf>h2 .cn{ align-self:center }
.shelf>.tip{ max-width:80ch; margin:0 0 var(--s4); color:var(--soft); font-size:var(--t1); line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.offer{ display:flex; align-items:center; gap:var(--s2); margin:var(--s4) 0 0; padding:var(--s2) var(--s3); background:var(--panel); color:var(--body); font-size:var(--t2) }
.offer:hover{ color:var(--ink) }
.offer i{ width:12px; height:12px; transform:rotate(45deg); box-shadow:0 0 0 1px var(--hair) }
.offer b{ color:var(--ink) }
.offer kbd{ margin-left:var(--s2); padding:.05em .4em; border:1px solid var(--hair); font:600 var(--t0)/1.3 var(--f); color:var(--soft) }
.empty{ display:grid; min-height:40vh; place-content:center; gap:var(--s2); text-align:center; color:var(--soft) }
.empty b{ color:var(--ink); font-size:var(--t3) }
.empty button{ justify-self:center; margin-top:var(--s2); padding:var(--s2) var(--s4); background:var(--ink); color:var(--paper); font-weight:700 }

/* list – the main page's catalog entry: name and editable readings on one line, the reason
   the space exists, then its channels as full sliders (their height is the density) */
.list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,21rem),1fr)); gap:var(--s2) var(--s6) }
.card{ position:relative; min-width:0; padding:var(--s3) var(--s3) var(--s4); transition:background-color var(--dur-micro) var(--ease-out) }
.card:hover{ background:color-mix(in oklab, var(--ink) 3%, transparent) }
.card.on{ background:var(--panel) }
.card .eh{ display:flex; align-items:baseline; justify-content:space-between; gap:var(--s2) var(--s4) }
.card .nm{ flex:0 1 auto; min-width:0; font-size:var(--text-md); font-weight:700; line-height:1.15; letter-spacing:-.01em; text-align:left; text-wrap:balance }
.card .nm::after,.tbl .nm::after{ content:'↗'; display:inline-block; width:0; text-indent:.3em; white-space:nowrap; font-weight:600; opacity:0; transition:opacity var(--dur-micro) var(--ease-out) }
.card .nm:hover::after,.tbl .nm:hover::after{ opacity:1 }
.cvs{ display:flex; flex-shrink:0; gap:var(--s3) }
.cvp{ display:flex; align-items:baseline; border-bottom:var(--ulw) solid transparent }
.card:hover .cvp,.card:focus-within .cvp{ border-bottom-color:var(--hair) }
.cvp:hover,.cvp:focus-within{ border-bottom-color:var(--cur,var(--ink))!important }
.cl{ font-style:normal; font-size:var(--t1); font-weight:600; color:var(--soft); padding-right:.3em }   /* the soft token, not a 42 % ink – two-letter symbols (IgPgTg) must clear 4.5:1 */
.cv{ width:3.2rem; padding:0 0 .15em; border:0; background:none; outline:none; font-size:var(--t2); font-weight:600; color:var(--body); font-variant-numeric:tabular-nums }
@supports(field-sizing:content){ .cv{ field-sizing:content; width:auto; min-width:2rem } }
.cvp:focus-within .cv{ color:var(--ink) }
.card .story{ margin:var(--s1) 0 var(--s2); color:var(--soft); font-size:var(--t1); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
.chs{ display:flex; flex-direction:column; background:var(--panel) }
.ch{ --h:var(--s6); position:relative; height:var(--h); background:var(--checker); cursor:ew-resize; touch-action:pan-y; user-select:none }
.ch .g,.bar2 .bg{ position:absolute; inset:0; pointer-events:none }
/* ONE native range recipe for every strip and bar – the main page's: the input overhangs half a
   thumb each side so values land exactly at the edges; the thumb IS the rhombus tick, wearing
   the current color ringed by its own ink, the inverse ring joining on attention */
.nrg{ position:absolute; top:0; bottom:0; left:-4px; z-index:3; width:calc(100% + 8px); height:100%; margin:0; padding:0; appearance:none; -webkit-appearance:none; background:transparent; cursor:ew-resize; --tks:var(--picker-size) }
.nrg::-webkit-slider-runnable-track{ height:100%; border:0; background:transparent }
.nrg::-moz-range-track{ border:0; background:transparent }
.nrg::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:var(--tks); height:var(--tks); margin-top:calc((var(--h,40px) - var(--tks))/2); border:var(--picker-line) solid var(--tki,transparent); border-radius:0; background:var(--tkc,transparent); transform:rotate(45deg); transition:width var(--dur-micro) var(--ease-out),height var(--dur-micro) var(--ease-out),margin var(--dur-micro) var(--ease-out) }
.nrg::-moz-range-thumb{ width:var(--tks); height:var(--tks); border:var(--picker-line) solid var(--tki,transparent); border-radius:0; background:var(--tkc,transparent); transform:rotate(45deg) }
.ch:hover .nrg,.bar2:hover .nrg{ --tks:var(--picker-active-size) }
.ch:hover .nrg::-webkit-slider-thumb,.bar2:hover .nrg::-webkit-slider-thumb{ box-shadow:0 0 0 var(--picker-line) var(--tkv,transparent) }
.ch:hover .nrg::-moz-range-thumb,.bar2:hover .nrg::-moz-range-thumb{ box-shadow:0 0 0 var(--picker-line) var(--tkv,transparent) }
.nrg:focus{ outline:none }
.nrg:focus-visible::-webkit-slider-thumb{ box-shadow:0 0 0 3px var(--paper), 0 0 0 4.5px var(--ink) }

/* table – the spec sheet: every space on one line, sortable by any column */
.tblw{ width:max-content; min-width:100%; margin:var(--s3) calc(-1*var(--s2)) 0 }   /* wider than the column → the catalog itself scrolls sideways, so the header row stays sticky */
.tbl{ width:100%; border-collapse:separate; border-spacing:0; font-size:var(--t1) }
.tbl th{ position:sticky; top:0; z-index:2; padding:var(--s2); border-bottom:1px solid var(--hair); background:var(--paper); color:var(--soft); font-size:var(--t0); font-weight:700; letter-spacing:.08em; text-align:left; text-transform:uppercase; white-space:nowrap; cursor:pointer; user-select:none }
.tbl th:hover,.tbl th.on{ color:var(--ink) }
.tbl th .ar{ margin-left:.3em }
.tbl td{ padding:var(--s2); border-bottom:1px solid var(--hair); color:var(--body); vertical-align:baseline; white-space:nowrap }   /* one line per space – a spec sheet scans across, and scrolls sideways before it grows tall */
.tbl tr.row{ cursor:default }
.tbl tr.row:hover td{ background:color-mix(in oklab, var(--ink) 3%, transparent) }
.tbl tr.row.on td{ background:var(--panel) }
.tbl tr.gh td{ padding:var(--s5) var(--s2) var(--s1); border-bottom:0; color:var(--ink); font-size:var(--t2); font-weight:800 }
.tbl .nm{ color:var(--ink); font-weight:700; text-align:left }
.tbl .id{ display:block; color:var(--soft); font-size:var(--t0) }
.tbl .vals{ font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink) }
.tbl .chsym{ white-space:nowrap }
.tbl .yes{ font-weight:700; color:var(--ink) }

/* ── the reading pane: the main page's dossier, set in a column beside the catalog ── */
.pane{ grid-area:pane; position:relative; min-height:0; overflow:hidden auto; overscroll-behavior:contain; border-left:1px solid var(--hair); background:var(--paper) }
.rsz{ position:absolute; top:0; bottom:0; left:0; z-index:6; width:7px; cursor:col-resize }
.rsz::after{ content:''; position:absolute; top:0; bottom:0; left:2px; width:2px; background:transparent; transition:background-color var(--dur-micro) var(--ease-out) }
.rsz:hover::after,.rsz.drag::after{ background:var(--cur,var(--ink)) }
.app.focus .rsz{ display:none }
.phead{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:var(--s1); min-height:2.75rem; padding:0 var(--s3) 0 var(--s5); border-bottom:1px solid transparent; background:var(--paper); transition:border-color var(--dur-short) var(--ease-out) }
.phead.stuck{ border-bottom-color:var(--hair) }
.phead .pt{ min-width:0; overflow:hidden; font-weight:800; text-overflow:ellipsis; white-space:nowrap; opacity:0; transition:opacity var(--dur-short) var(--ease-out) }
.phead.stuck .pt{ opacity:1 }
.phead .sp{ flex:1 }
.pbtn{ display:grid; flex:none; width:32px; height:32px; place-items:center; color:var(--soft); transition:color var(--dur-micro) var(--ease-out) }
.pbtn:hover,.pbtn[aria-pressed="true"]{ color:var(--ink) }
.pbtn svg{ width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
.star[aria-pressed="true"] svg{ fill:currentColor }
.pbody{ padding:var(--s2) var(--s5) var(--s8) }
.app.focus .pbody{ max-width:64rem; margin:0 auto; padding-inline:var(--s8) }
.dh .dcat{ display:block; margin-bottom:var(--s2); color:var(--soft); font-size:var(--t2) }
.dh h1{ font-size:clamp(1.6rem,2.6vw,2.3rem); font-weight:800; line-height:1.02; letter-spacing:-.02em; overflow-wrap:anywhere }
.dh h1 .htag{ margin-left:var(--s3); vertical-align:middle }
.dlede{ max-width:52ch; margin:var(--s3) 0 0; color:var(--body); font-size:var(--text-md); line-height:1.45; text-wrap:pretty }
.dorig{ margin:var(--s2) 0 0; color:var(--soft); font-size:var(--t2) }
.dpills{ display:flex; flex-wrap:wrap; gap:var(--s2); margin:var(--s3) 0 0 }
.tag{ font-size:var(--t0); font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); background:var(--panel); padding:var(--s1) var(--s2); line-height:1.1; font-style:normal }
.tag[title]{ cursor:help }
.dhr{ margin:var(--s5) 0; border:0; border-top:1px solid var(--hair) }
/* the instrument: big readings, then one bar per channel, then the channel-pair planes */
.bigch{ display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--s2) var(--s5); margin-bottom:var(--s4) }
.bch{ display:flex; align-items:baseline }
.bch i{ font-style:normal; font-size:var(--t2); font-weight:600; opacity:.42; padding-right:.35em }
.bch input{ width:4.4rem; padding:0 0 .1em; border:0; border-bottom:var(--ulw) solid transparent; background:none; outline:none; font-size:var(--t4); font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums }
@supports(field-sizing:content){ .bch input{ field-sizing:content; width:auto; min-width:1.6rem } }
.bch input:hover{ border-bottom-color:var(--hair) } .bch input:focus{ border-bottom-color:var(--cur,var(--ink)) }
.bch .u{ font-style:normal; font-size:var(--t2); color:var(--body); padding-left:.15em }
.pick{ display:flex; flex-direction:column; gap:var(--s2) }
.bar2{ --h:var(--ctl); position:relative; height:var(--ctl); background:var(--checker); cursor:ew-resize; touch-action:pan-y; user-select:none }
.bar2 .bgc{ position:absolute; inset:0; width:100%; height:100%; display:none; pointer-events:none }
.bar2 .cnm{ position:absolute; left:.225rem; top:.175rem; z-index:1; font-size:var(--t0); font-weight:700; letter-spacing:.02em; pointer-events:none }
.bar2 .sv{ position:absolute; bottom:.175rem; z-index:1; font-size:var(--t0); font-weight:600; opacity:.75; pointer-events:none }
.bar2 .lo{ left:.225rem } .bar2 .md{ left:50%; transform:translateX(-50%) } .bar2 .hi{ right:.275rem }
.planes{ display:flex; gap:var(--s2); margin-top:var(--s2) }
.pl{ position:relative; flex:1 1 0; min-width:0; max-width:18.6rem; aspect-ratio:1; background:var(--checker); cursor:crosshair; touch-action:none }
.pl canvas{ display:block; width:100%; height:100% }
.pl.polar{ background:none } .pl.polar canvas{ border-radius:50%; background:var(--checker) }
.pl .cx{ position:absolute; z-index:2; width:var(--picker-size); height:var(--picker-size); transform:translate(-50%,-50%) rotate(45deg); background:var(--tkc,transparent); border:var(--picker-line) solid var(--tki,transparent); pointer-events:none }
.pl:hover .cx{ width:var(--picker-active-size); height:var(--picker-active-size); box-shadow:0 0 0 var(--picker-line) var(--tkv,transparent) }
.pl .lx,.pl .ly{ position:absolute; z-index:1; font-size:var(--t0); font-weight:700; pointer-events:none }
.pl .ly{ top:.175rem; left:.225rem } .pl .lx{ right:.275rem; bottom:.175rem }
.cssline{ display:flex; align-items:center; gap:var(--s2); margin-top:var(--s3); font-size:var(--t2) }
.cssline code{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:none; padding:0; color:var(--body); cursor:copy }
.cssline code:hover{ color:var(--ink) }
.cpy{ flex:none; padding:var(--s1) var(--s2); background:var(--panel); font-size:var(--t0); font-weight:700; letter-spacing:.08em; text-transform:uppercase; cursor:copy }
.cpy:hover{ background:var(--ink); color:var(--paper) }
/* the plates: its shape (the sRGB body in its own axes), its reach on the xy plane, its tone curve */
/* the instrument, its three plates and the record share ONE grid, arranged twice: beside the
   catalog they stack (the plates a row of three); given the workspace they take the dossier's
   own layout – instrument | shape, record | reach and tone curve */
.dgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); grid-template-areas:"inst inst inst" "solid gam trc" "props props props"; gap:var(--s6) var(--s4); align-items:end }
.dgrid.no3{ grid-template-columns:repeat(2,minmax(0,1fr)); grid-template-areas:"inst inst" "gam trc" "props props" }

<template id="aboutT">
	<div class="pbody about">
		<h2><span class="tnum" data-count>162</span> coordinate systems.</h2>
		<p class="lead">Web, print, photography, film, broadcast, art, science, and history. Canonical conversions, channels, gamut shapes, provenance, cited references, known limits. Convert any space to any other: <em>rgb to oklch</em>, <em>slog3 to rec709</em>, <em>cct-duv to rgb</em>.</p>
		<ul class="trust" aria-label="why you can trust the data">
			<li tabindex="0" title="All 162 spaces have an independent cited conformance anchor; 29 are additionally cross-checked in both directions against colorjs.io, the CSS Color editors' implementation, at 1/255.">Reference-tested</li>
			<li tabindex="0" title="Channel ranges follow CSS and each defining source – familiar units rather than one universal normalization.">Conventional ranges</li>
			<li tabindex="0" title="CC0 1.0 – no rights reserved. Use, sell, fork or embed it anywhere; no attribution required.">Public domain</li>
		</ul>
		<p class="how"><b>Pick a color</b> in the header – every space in the catalog writes it in its own coordinates. <b>Select a space</b> to read its page here; drag any strip or plane to move the color.</p>
		<div class="faq">
		<details class="fqa" open><summary>What is a color space?</summary>
		<p>A coordinate system for color: axes, ranges, and a rule tying the numbers to measurable light. The same orange is <a href="#rgb(255 128 0)" title="make this the current color – the URL carries the notation"><code>rgb(255 128 0)</code></a>, <a href="#oklch(0.732 0.186 53)" title="make this the current color – the URL carries the notation"><code>oklch(0.732 0.186 53)</code></a> and XYZ <a href="#color(xyz-d65 0.49 0.367 0.045)" title="make this the current color – the URL carries the notation"><code>[49, 36.7, 4.5]</code></a> – the same color, written three ways. A palette is a handful of chosen colors; a space is a way to write down any color at all.</p></details>
		<details class="fqa" open><summary>Which space should I actually use?</summary>
		<p>It depends on the task:</p>
		<ul>
		<li>storing and sharing images – <a href="#rgb">sRGB</a>, the web's default;</li>
		<li>designing palettes and gradients – <a href="#oklch">OKLCH</a>, where equal steps look equal;</li>
		<li>math on light (blending, blurring, 3D) – <a href="#lrgb">linear-light RGB</a>;</li>
		<li>shooting and grading video – your camera's log space, delivered in <a href="#rec709">Rec. 709</a> or <a href="#rec2100-pq">Rec. 2100</a>;</li>
		<li>measuring how different two colors look – <a href="#lab">CIELAB</a> or <a href="#din99o-lab">DIN99o</a>.</li>
		</ul>
		<p>The <em>purpose</em> grouping in the filter shelves the catalog the same way.</p></details>
		<details class="fqa"><summary>What should I use instead of HSL?</summary>
		<p><a href="#oklch">OKLCH</a>. It keeps the same three controls – hue, chroma, lightness – but its lightness is trustworthy: in <a href="#hsl">HSL</a>, yellow at L=50 is about four times as bright as blue at L=50, so equal L doesn't mean equal brightness. In OKLCH it does. CSS supports <code>oklch()</code> natively.</p></details>
		<details class="fqa"><summary>Why do my gradients turn muddy in the middle?</summary>
		<p>Because they're computed in gamma-encoded sRGB, where averaging two colors' numbers produces darker, duller light than actually mixing their light would. Interpolating in <a href="#oklab">OKLab</a> avoids this. Every dossier's <em>interpolate</em> row draws the same blend through two spaces side by side, so you can see the difference before choosing.</p></details>
		<details class="fqa"><summary>What does “out of gamut” mean?</summary>
		<p>A color one space can describe but another – or your screen – can't show. A vivid <a href="#p3">Display P3</a> green simply doesn't exist in sRGB: convert it, and the numbers fall outside the valid range. The atlas keeps this visible: the pill next to the current color names the tightest standard gamut that holds it, and out-of-range stretches ghost over a checkerboard.</p></details>
		<details class="fqa"><summary>Why 162 spaces – isn't one enough?</summary>
		<p>Because each one fixed a real limitation of an earlier one, and the older ones are still in use. <a href="#xyz">XYZ</a> made color measurable (1931), <a href="#lab">Lab</a> made differences comparable (1976), <a href="#oklab">OKLab</a> made screen steps look even (2020) – and along the way, broadcast, print and camera makers each needed encodings of their own. Grouping the catalog by <em>era</em> (in the filter) walks through the whole story.</p></details>
		<details class="fqa"><summary>Aren't most of these spaces dead?</summary>
		<p>Many are retired from daily use, but they still do quiet, real work. Archives still decode <a href="#ntsc">NTSC</a> tapes; <a href="#cineon">Cineon</a> still opens the film scans of the '90s; <a href="#photoycc">PhotoYCC</a> still holds family albums burned to PhotoCD. Reading old pictures takes the original math, and keeping that math available is part of what a reference is for. The history filter gathers them by era.</p></details>
		<details class="fqa"><summary>Where's Pantone, NCS, RAL?</summary>
		<p>Those are licensed products: their colors are defined by data the owners sell, not by published formulas – so there's no open math to implement, and redistributing their tables wouldn't be legal. Close relatives whose math is public are here: <a href="#munsell">Munsell</a> (its 1943 renotation is public record) and <a href="#ral-design">RAL Design</a> (defined directly in CIELAB). The rule of thumb: if the math was ever published, it belongs in the collection.</p></details>
		<details class="fqa"><summary>Are conversions exact? Do round trips lose data?</summary>
		<p>Conversions are closed formulas, not lookup approximations, and round trips return within floating-point noise. The few exceptions are documented where they occur: <a href="#osaucs">OSA-UCS</a> has no closed inverse, atlas systems like <a href="#munsell">Munsell</a> interpolate between published grades, and <code>rgb</code> output clamps to the sRGB gamut – route through <a href="#xyz">XYZ</a> or <a href="#lrgb">linear RGB</a> when you need values outside it.</p></details>
		<details class="fqa"><summary>Which of these can CSS write?</summary>
		<p>Natively <code>rgb()</code>, <code>hsl()</code>, <code>hwb()</code>, <code>lab()</code>, <code>lch()</code>, <code>oklab()</code>, <code>oklch()</code>, plus <code>color()</code> for Display P3, Adobe RGB, ProPhoto, Rec. 2020, linear sRGB and XYZ. Each dossier's <em>css</em> tab writes the current color in copyable form; spaces CSS lacks ship as ICC profiles or LUTs instead.</p></details>
		<details class="fqa"><summary>What are the 37 camera log spaces for?</summary>
		<p>A log curve packs a sensor's wide dynamic range into a small recordable code range, so highlights and shadows both survive. Every vendor ships its own: <a href="#logc4">ARRI LogC4</a>, <a href="#slog3">Sony S-Log3</a>, <a href="#log3g10">RED Log3G10</a>. Footage is graded in log or through ACES, then delivered in <a href="#rec709">Rec. 709</a> or <a href="#rec2100-pq">Rec. 2100</a>. Each log dossier exports the conversion as a <code>.cube</code> LUT your editor loads.</p></details>
		<details class="fqa"><summary>What makes a space HDR?</summary>
		<p>Its transfer function budgets code values for luminance far beyond a standard display's white. <a href="#rec2100-pq">PQ</a> addresses absolute levels up to 10,000 nits; <a href="#rec2100-hlg">HLG</a> stays compatible with SDR broadcast; Rec. 2100 carries both. <a href="#ictcp">ICtCp</a> and <a href="#jzazbz">Jzazbz</a> are their perceptual companions for grading and difference work.</p></details>
		<details class="fqa"><summary>Why do the numbers differ from other libraries?</summary>
		<p>Same colors, different conventions. This library keeps each space's conventional ranges – RGB 0–255, Lab lightness 0–100, hue 0–360 – where most libraries flatten everything to 0–1. Every card shows its ranges; in code they're <code>space.oklch.range</code>.</p></details>
		<details class="fqa"><summary>Why should I trust these formulas?</summary>
		<p>You don't have to take them on faith – everything here is set up to be checked:</p>
		<ul>
		<li>every space links the paper or spec it implements;</li>
		<li>values are tested against <a href="https://colorjs.io">colorjs.io</a>, an independent implementation, wherever the two overlap;</li>
		<li>camera-log conversions are compared against the Academy's official ACES transforms.</li>
		</ul>
		<p><a href="https://github.com/colorjs/color-space/blob/master/docs/formula-verification.md">formula-verification.md</a> records what was checked against what – including a few places where the published papers themselves turned out to have errors.</p></details>
		<details class="fqa"><summary>Why does red + green make yellow on screens, but mud in paint?</summary>
		<p>Screens add light: red and green light sum to yellow, which is how every RGB space works. Paint subtracts it: each pigment absorbs part of the spectrum, and mixing multiplies the losses, so the result darkens toward brown. Each arithmetic gets its own shelf here – additive RGB on one, subtractive <a href="#cmyk">CMYK</a> and the painters' <a href="#ryb">RYB</a> on the other.</p></details>
		<details class="fqa"><summary>Where are viridis and the other colormaps?</summary>
		<p>They're close cousins, not quite color spaces. A colormap like viridis is a one-dimensional path drawn through a color space, made for painting data – so it lives one level above a conversion library. The connection is real, though: viridis was designed inside <a href="#cam02-ucs">CAM02-UCS</a>, chosen so its steps look even, and that space is here. To design your own, a straight line through <a href="#oklab">OKLab</a> is a good start.</p></details>
		</div>
		<pre tabindex="0" aria-label="Code example"><b>import</b> space <b>from</b> 'color-space'

space.rgb.oklch(255, 128, 0)      <i>// → [0.732, 0.186, 53]</i>
space.oklch.rgb(0.65, 0.25, 180)  <i>// any of 162 × 161 pairs</i></pre>

<script type="module">
import { space, meta, clamp, classify, ramp, plane, lensFor, toSpace, hex, LUTOK, pathToRgb, mixInSpace, rotateHue, locus, visibleXYZ, inVisSolid } from './js/core.js'

import { cube as lutCube, channelwise as lutChannelwise } from './js/study-runtime.js'

const $ = id => document.getElementById(id)
const app = $('app')
const esc = t => String(t ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')
const sentence = t => { t = String(t).trim(); if (/^[a-z][a-z\s]/.test(t)) t = t[0].toUpperCase() + t.slice(1); return /[.!?…]$/.test(t) ? t : t + '.' }
const store = { get: k => { try { return localStorage[k] } catch { return undefined } }, set: (k, v) => { try { localStorage[k] = v } catch {} } }
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1100) }
const copy = t => { navigator.clipboard?.writeText(t); toast('Copied') }

// ── the vocabulary: families (README cut), purposes, facets ──
const famOf = {}; for (const c of FAMILIES) for (const s of c.spaces) famOf[s] ??= c.name
const PLABEL = { print: 'Print & surface' }
const plabel = t => PLABEL[t] || t[0].toUpperCase() + t.slice(1)
const CSSN = { rgb:'rgb()', lrgb:'color(srgb-linear)', hsl:'hsl()', hwb:'hwb()', lab:'lab()', lchab:'lch()', oklab:'oklab()', oklch:'oklch()',
	p3:'color(display-p3)', a98rgb:'color(a98-rgb)', prophoto:'color(prophoto-rgb)', rec2020:'color(rec2020)', xyz:'color(xyz-d65)', 'xyz-d50':'color(xyz-d50)' }
const capSets = { css: new Set(Object.keys(CSSN)), lut: new Set(LUTOK), icc: new Set(SPACES.filter(s => { try { return !!iccKind(space[s], { xyz: space.xyz }) } catch { return false } })), gl: new Set(), wasm: new Set() }
const legacy = new Set(SPACES.filter(s => HISTORICAL.has(s) || meta[s].year < 1960))
const GEO = s => ({ polar:'polar', opponent:'opponent' })[classify(s).archetype] || 'component'
// facets – [key, question, [[value, answer], …]]; the question is what the unset select shows
const FDEF = [
	['avail','Runs as',[['css','CSS'],['gl','GLSL'],['wasm','WASM'],['lut','LUT'],['icc','ICC']]],
	['chn','Channels',[['1','1 channel'],['2','2 channels'],['3','3 channels'],['4','4+ channels']]],
	['range','Range',[['sdr','SDR'],['hdr','HDR']]],
	['geo','Geometry',[['component','Component'],['opponent','Opponent'],['polar','Polar']]],
	['signal','Signal',[['display','Display-referred'],['scene','Scene-referred']]],
	['enc','Encoding',[['gamma','Gamma'],['linear','Linear'],['log','Log'],['pq','PQ'],['hlg','HLG'],['perceptual','Perceptual'],['chromaticity','Chromaticity']]],
	['wp','White',[['D65','D65'],['D50','D50'],['D60','D60'],['DCI','DCI'],['A','A'],['C','C'],['E','E']]],
	['status','Status',[['current','In use'],['historical','Historical']]],
]
const FTIP = {
	avail:'where the space runs beyond JS – natively in CSS, as GLSL shaders, in WASM, as a LUT, as an ICC profile',
	chn:'how many coordinates one color takes', range:'SDR encodes up to display white; HDR encodes brighter-than-white light',
	geo:'component: independent axes · opponent: a lightness with two color-difference axes · polar: lightness, chroma and hue',
	signal:'display-referred encodes what a screen shows; scene-referred encodes the light a camera saw',
	enc:'the tone curve between the numbers and linear light', wp:'the reference white the space is defined against', status:'in use today, or kept to read older material' }
const FTEST = {
	avail:(s,v) => capSets[v]?.has(s), chn:(s,v) => v === '4' ? meta[s].channels.length >= 4 : meta[s].channels.length === +v,
	range:(s,v) => (meta[s].dynamic || 'sdr') === v, geo:(s,v) => GEO(s) === v, signal:(s,v) => meta[s].referred === v,
	enc:(s,v) => meta[s].encoding === v, wp:(s,v) => meta[s].illuminant === v, status:(s,v) => v === 'historical' ? legacy.has(s) : !legacy.has(s) }
Promise.all([import('./js/study-runtime.js').catch(() => null), import('./js/gl.js').catch(() => null)]).then(([w, g]) => {
	if (w?.spaces) capSets.wasm = new Set(w.spaces.filter(s => SPACES.includes(s)))
	if (g?.hasPlaneGL) capSets.gl = new Set(SPACES.filter(s => g.hasPlaneGL(s)))
	paintBar() })

// ── state: one current color (authored in whichever space last spoke), one selection, one view.
// The URL carries the reading: ?s= the open space, ?v= view, ?a= arrangement, #color ──
const P0 = new URLSearchParams(location.search)
const pick = (v, list, d) => list.includes(v) ? v : d
const S = {
	space: 'oklch', vals: [0.72, 0.16, 41],   // the house coral – every instrument has something to show
	sel: null, focus: P0.has('focus'), pane: false,
	view: pick(P0.get('v') || store.get('twView'), ['grid','list','table'], 'grid'),
	arrange: pick(P0.get('a') || store.get('twArr'), ['family','purpose','era','name'], 'family'),
	F: Object.fromEntries(FDEF.map(([k]) => [k, ''])), q: '',
	style: pick(P0.get('style'), ['quiet','notebook','studio','instrument'], 'quiet'),
	preview: pick(P0.get('preview'), ['sliders','planes'], 'planes'),
	quant: 'smooth', gamut: 'vis',
	tsort: null, tdir: 1, drag: false,
}
// the exact color, unclamped: every other space converts from it, so a wide-gamut pick survives
let RGBX = [246,125,79], RGB = [246,125,79]
const syncRGB = () => { try { RGBX = S.space === 'rgb' ? S.vals.slice() : space[S.space].rgb(...S.vals) } catch { RGBX = [0,0,0] }
	if (!RGBX.every(isFinite)) RGBX = rgbF(S.space, S.vals); RGB = RGBX.map(x => clamp(x, 0, 255)) }
syncRGB()
const hexNow = () => hex(RGB)
// exact coordinates (the code and CSS surfaces speak these); the instruments read them held inside
// each space's own ranges – hue wraps – so a wide-gamut color never hands HSL a 553 % saturation to edit
const exactOf = s => { if (s === S.space) return S.vals.slice()
	let v; try { v = toSpace(s, RGBX) } catch {}
	if (!v || !v.every(isFinite)) { try { v = toSpace(s, RGB) } catch {} }
	return v && v.every(isFinite) ? v : meta[s].channels.map(c => c.min) }
// the sRGB remixes – hue/saturation pickers, the Ok and HSLuv pickers, the subtractive complements –
// are formulas over the sRGB cube: outside it their numbers mean nothing, so they read the color you
// SEE; every colorimetric space keeps its exact reading, clamped to its box (the main page's rule)
const REMIX = new Set([...(sections.find(c => c.name === 'Cylindrical')?.spaces || []), 'okhsl', 'okhsv', 'okhwb', 'hsluv', 'hpluv', 'cmyk', 'cmy', 'ryb'])
const inRange = (s, v) => v.every((x, i) => { const c = meta[s].channels[i]; return c.max === 360 || (x >= c.min - 1e-6 && x <= c.max + 1e-6) })
const valsOf = s => { let v = exactOf(s); if (s === S.space) return v
	if (REMIX.has(s) && !inRange(s, v)) { try { const w = toSpace(s, RGB); if (w.every(isFinite)) v = w } catch {} }
	return v.map((x, i) => { const c = meta[s].channels[i]; return c.max === 360 ? ((x % 360) + 360) % 360 : clamp(x, c.min, c.max) }) }
const quantArg = () => /^(10|20)$/.test(S.quant) ? +S.quant : S.quant === 'smooth' ? 0 : S.quant

// ── color notation: every CSS color (css-color-4 §§ 4–10), plus any space's own coordinates ──
const CSSFN = { rgb:'rgb', rgba:'rgb', hsl:'hsl', hsla:'hsl', hwb:'hwb', lab:'lab', lch:'lchab', oklab:'oklab', oklch:'oklch' }
const COLORID = { srgb:['rgb',255], 'srgb-linear':['lrgb',1], 'display-p3':['p3',1], 'a98-rgb':['a98rgb',1], 'prophoto-rgb':['prophoto',1], rec2020:['rec2020',1], xyz:['xyz',100], 'xyz-d65':['xyz',100], 'xyz-d50':['xyz-d50',100] }
function parseColor(str) {
	const t = String(str || '').trim().toLowerCase(); if (!t) return null
	let m = t.match(/^#?([0-9a-f]{3}|[0-9a-f]{6})$/)
	if (m && (t[0] === '#' || m[1].length === 6)) { let h = m[1]; if (h.length === 3) h = [...h].map(c => c + c).join(''); return { s:'rgb', vals:[0,2,4].map(i => parseInt(h.slice(i,i+2),16)) } }
	if (NAMES[t]) return { s:'rgb', vals:NAMES[t].slice() }
	m = t.match(/^([a-z][a-z0-9-]*)\s*\(([^)]*)\)$/) || t.match(/^([a-z][a-z0-9-]*)\s+(-?[\d.].*)$/); if (!m) return null
	const fn = m[1], parts = m[2].replace(/\/.*$/, '').split(/[\s,]+/).filter(Boolean)
	if (fn === 'color') { const c = COLORID[parts.shift()]; if (!c) return null
		const v = parts.map(p => p.endsWith('%') ? parseFloat(p) / 100 : parseFloat(p))
		return v.length === 3 && v.every(isFinite) ? { s:c[0], vals:v.map(x => x * c[1]) } : null }
	const s = CSSFN[fn] || (SPACES.includes(fn) ? fn : null); if (!s) return null
	const ch = meta[s].channels
	const v = parts.map((p, i) => { const x = parseFloat(p); if (!p.endsWith('%')) return x
		if (s === 'hsl' || s === 'hwb') return x
		if (s === 'rgb') return x / 100 * 255
		if ((s === 'oklab' || s === 'oklch') && i === 0) return x / 100
		return ch[i].min + (ch[i].max - ch[i].min) * x / 100 })
	return v.length === ch.length && v.every(isFinite) ? { s, vals:v } : null
}
// CSS Color 4 writes 14 of these spaces natively – lab()/lch() are D50 (§9); color() puts reference
// white at Y = 1 where this library's XYZ uses Y = 100 (§10)
const nf = (v, d) => { const t = (+v).toFixed(d).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, ''); return t === '-0' ? '0' : t }
const colf = (id, v, k = 1) => `color(${id} ${v.map(x => nf(x / k, 4)).join(' ')})`
const CSSF = {
	rgb: v => `rgb(${v.map(x => Math.round(x)).join(' ')})`, hsl: v => `hsl(${nf(v[0],1)} ${nf(v[1],1)}% ${nf(v[2],1)}%)`, hwb: v => `hwb(${nf(v[0],1)} ${nf(v[1],1)}% ${nf(v[2],1)}%)`,
	lab: v => `lab(${nf(v[0],2)} ${nf(v[1],2)} ${nf(v[2],2)})`, lchab: v => `lch(${nf(v[0],2)} ${nf(v[1],2)} ${nf(v[2],1)})`,
	oklab: v => `oklab(${nf(v[0],3)} ${nf(v[1],3)} ${nf(v[2],3)})`, oklch: v => `oklch(${nf(v[0],3)} ${nf(v[1],3)} ${nf(v[2],1)})`,
	lrgb: v => colf('srgb-linear', v), p3: v => colf('display-p3', v), a98rgb: v => colf('a98-rgb', v), prophoto: v => colf('prophoto-rgb', v),
	rec2020: v => colf('rec2020', v), xyz: v => colf('xyz-d65', v, 100), 'xyz-d50': v => colf('xyz-d50', v, 100) }
// the smallest standard set that holds the color – the main page's pill, one vocabulary
const GAMLABEL = { srgb:'sRGB', p3:'P3', rec2020:'Rec.2020', vis:'surface', locus:'light', clip:'⚠' }
const GAMTIP = { srgb:'inside sRGB – every screen shows it', p3:'beyond sRGB, inside Display P3 – wide-gamut screens show it', rec2020:'beyond P3, inside Rec. 2020',
	vis:'beyond every display gamut, still a color a lit surface can show', locus:'beyond any surface – a real light, not an object color', clip:'past the spectral locus – no light at all has this chromaticity' }
function gamutOf() { const { space:s, vals } = S, eps = 1e-4, inR = (v, hi) => v.every(x => x >= -eps && x <= hi + eps), conv = to => s === to ? vals : space[s][to](...vals)
	try { if (inR(conv('rgb'), 255)) return 'srgb'; if (inR(conv('p3'), 1)) return 'p3'; if (inR(conv('rec2020'), 1)) return 'rec2020' } catch {}
	try { const X = s === 'xyz' ? vals : space[s].xyz(...vals); if (X.every(isFinite) && visibleXYZ(...X)) return inVisSolid(...X) ? 'vis' : 'locus' } catch {}
	return 'clip' }

// ── search: every field a person might remember a space by, ranked; the catalog becomes the
// result list and each entry says where it matched ──
const IDX = new Map(SPACES.map(s => { const m = meta[s], L = LORE[s] || {}
	return [s, { name: disp(s).toLowerCase(), by: (m.by || '').toLowerCase(), year: String(m.year || ''), fam: (famOf[s] || '').toLowerCase(),
		tags: (PURPOSE[s] || []).join(' '), chan: m.channels.map(c => `${c.name} ${c.symbol}`).join(' · ').toLowerCase(), css: (CSSN[s] || '').toLowerCase(),
		textRaw: [L.for, m.use, m.description, L.nm, L.sin].filter(Boolean).join(' · ') }] }))
for (const e of IDX.values()) e.text = e.textRaw.toLowerCase()
// names and ids match anywhere ("lab" finds CIELAB); prose, people and channels match at a word's
// start – "red" is RED Digital Cinema and the red channel, not every "referred"
const wordAt = (str, w) => { for (let i = str.indexOf(w); i >= 0; i = str.indexOf(w, i + 1)) if (!i || !/[a-z0-9]/.test(str[i-1])) return i; return -1 }
function score(s, q) { const e = IDX.get(s), words = q.split(/\s+/).filter(Boolean); let total = 0, why = null
	for (const w of words) { let best = 0, f = null
		const test = (str, base, field) => { if (!str) return; const i = field === 'id' || field === 'name' || field === 'css' ? str.indexOf(w) : wordAt(str, w); if (i < 0) return
			const sc = base + (i === 0 ? 20 : /[\s(·,–-]/.test(str[i-1]) ? 10 : 0) + (str === w ? 30 : 0); if (sc > best) { best = sc; f = field } }
		test(s, 95, 'id'); test(e.name, 95, 'name'); test(e.css, 60, 'css'); test(e.by, 55, 'by'); test(e.year, 55, 'year')
		test(e.fam, 45, 'family'); test(e.tags, 40, 'purpose'); test(e.chan, 35, 'channel'); test(e.text, 12, 'text')
		if (!best) return { sc:0 }
		total += best; if (!why && f !== 'name' && f !== 'id') why = { f, w } }
	return { sc:total, why } }
function whyHTML(s, why) { if (!why) return ''; const m = meta[s], e = IDX.get(s), w = why.w
	const mk = str => { const i = wordAt(str.toLowerCase(), w); return i < 0 ? esc(str) : esc(str.slice(0,i)) + '<mark>' + esc(str.slice(i, i+w.length)) + '</mark>' + esc(str.slice(i+w.length)) }
	if (why.f === 'by') return `by ${mk(m.by)}`
	if (why.f === 'year') return mk(String(m.year))
	if (why.f === 'family') return mk(famOf[s])
	if (why.f === 'purpose') return (PURPOSE[s] || []).map(t => t.includes(w) ? `<mark>${plabel(t)}</mark>` : plabel(t)).join(' · ')
	if (why.f === 'css') return mk(CSSN[s])
	if (why.f === 'channel') { const c = m.channels.find(c => `${c.name} ${c.symbol}`.toLowerCase().includes(w)); return c ? `channel ${mk(cname(c))}` : '' }
	const i = wordAt(e.text, w); if (i < 0) return ''
	const a = Math.max(0, e.textRaw.lastIndexOf(' ', Math.max(0, i - 28)) + 1), b = Math.min(e.textRaw.length, i + w.length + 36)
	return (a > 0 ? '…' : '') + mk(e.textRaw.slice(a, b)) + (b < e.textRaw.length ? '…' : '') }
const hl = (s, text) => { if (!S.q) return text
	const w = S.q.split(/\s+/).filter(Boolean).sort((a,b) => b.length - a.length)[0]; const i = text.toLowerCase().indexOf(w)
	return i < 0 ? text : text.slice(0,i) + '<mark>' + text.slice(i, i+w.length) + '</mark>' + text.slice(i+w.length) }

// ── what is shown, in what shelves ──
function passes(s, skip) {
	for (const [k] of FDEF) if (k !== skip && S.F[k] && !FTEST[k](s, S.F[k])) return false
	return true }
const RANKS = new Map(); { let i = 0; for (const c of sections) for (const s of c.spaces) RANKS.set(s, i++) }
function shelves() {
	const L = SPACES.filter(s => passes(s))
	if (S.q) { const q = S.q.toLowerCase(), hits = L.map(s => ({ s, ...score(s, q) })).filter(h => h.sc > 0).sort((a,b) => b.sc - a.sc || RANKS.get(a.s) - RANKS.get(b.s))
		WHY.clear(); for (const h of hits) WHY.set(h.s, h.why)
		return hits.length ? [{ name: `${hits.length} match${hits.length === 1 ? '' : 'es'} for “${esc(S.q)}”`, spaces: hits.map(h => h.s), search:true }] : [] }
	const set = new Set(L)
	if (S.arrange === 'name') return [{ name:'A–Z', spaces: L.slice().sort((a,b) => disp(a).localeCompare(disp(b))) }].filter(g => g.spaces.length)
	return (S.arrange === 'family' ? FAMILIES : GROUPS[S.arrange]()).map(g => ({ name: g.name, tip: g.tip, spaces: g.spaces.filter(s => set.has(s)) })).filter(g => g.spaces.length) }
const WHY = new Map()
let FLAT = []

// ── the catalog: three views over the same shelves ──
const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { paintItem(e.target, true); io.unobserve(e.target) } }, { rootMargin: '60%' })
// Featured spaces are editorial starting points, not personal favorites or a ranking.
const FEATURED = new Set(['rgb','p3','rec2020','hsl','hsv','oklch','lab','cam16','xyz','xyy','ycbcr-bt709','rec2100-pq','acescg','logc4','slog3','cmyk','munsell','ryb'])
const cardHTML = (s, main = false) => { const cls = classify(s), story = LORE[s]?.for ? sentence(LORE[s].for) : meta[s].use || ''
	const planes = main && S.preview === 'planes' && cls.ch.length >= 2
	return `<article class="card${main ? ' featured' : ' compact'}${s === S.sel ? ' on' : ''}" data-s="${s}" role="listitem">
		<div class="eh"><button class="nm" type="button" aria-pressed="${s === S.sel}">${hl(s, nbh(disp(s)))}</button>${main ? `<span class="origin tnum">${meta[s].year || ''}</span>` : ''}</div>
		${main ? `<p class="story">${WHY.get(s) ? whyHTML(s, WHY.get(s)) : esc(story)}</p>` : ''}
		<div class="cvs">${cls.ch.map((c,i) => `<label class="cvp" title="${esc(cname(c))}"><i class="cl" aria-hidden="true">${c.sym}</i><input class="cv" data-i="${i}" inputmode="decimal" spellcheck="false" autocomplete="off" aria-label="${esc(disp(s))} ${esc(cname(c))}"></label>`).join('')}</div>
		${planes ? `<div class="planes">${pairsOf(cls).map(([a,b]) => `<div class="pl" data-a="${a}" data-b="${b}" tabindex="0" role="group" aria-label="${esc(disp(s))}: ${esc(cname(cls.ch[a]))} horizontally, ${esc(cname(cls.ch[b]))} vertically; use arrow keys"><canvas width="144" height="144"></canvas><i class="cx"></i><span class="ly">${cls.ch[b].sym}</span><span class="lx">${cls.ch[a].sym}</span></div>`).join('')}</div>` : `<div class="chs">${cls.ch.map((c,i) => `<div class="ch" data-i="${i}"><div class="g"></div><input type="range" class="nrg" data-i="${i}" min="${c.min}" max="${c.max}" step="any" aria-label="${esc(disp(s))} ${esc(cname(c))} slider"></div>`).join('')}</div>`}
	</article>` }
const TCOLS = [['name','Space'],['ch','Channels'],['vals','Your color'],['year','Year'],['by','By'],['fam','Family'],['tags','Purpose'],['model','Model'],['wp','White'],['css','CSS']]
const TKEY = { name: s => disp(s).toLowerCase(), ch: s => meta[s].channels.length, year: s => meta[s].year || 0, by: s => (meta[s].by || '').toLowerCase(), fam: s => RANKS.get(s), tags: s => (PURPOSE[s] || [''])[0], model: s => `${meta[s].method} ${meta[s].encoding}`, wp: s => meta[s].illuminant || '', css: s => CSSN[s] ? 0 : 1 }
const rowHTML = s => { const m = meta[s]
	return `<tr class="row${s === S.sel ? ' on' : ''}" data-s="${s}"><td><button class="nm" type="button" aria-pressed="${s === S.sel}">${hl(s, esc(disp(s)))}</button><span class="id">${s}</span></td>
		<td class="chsym" title="${esc(m.channels.map(c => `${cname(c)} ${fmtc(c.min,c)} … ${fmtc(c.max,c)}${unit(c)}`).join('\n'))}">${m.channels.map(c => c.symbol).join(' ')}</td>
		<td class="vals"></td><td class="tnum">${m.year || ''}</td><td>${esc(m.by || '')}</td><td>${esc(famOf[s] || '')}</td><td>${(PURPOSE[s] || []).map(plabel).join(', ')}</td>
		<td>${[m.method, m.encoding].filter(Boolean).join(' · ')}</td><td>${m.illuminant || ''}</td><td class="yes">${CSSN[s] ? 'CSS' : ''}</td></tr>` }
function render() {
	const G = shelves(); FLAT = G.flatMap(g => g.spaces)
	const n = new Set(FLAT).size, cat = $('cat')
	io.disconnect()
	const qc = S.q && parseColor(S.q), qhex = qc ? hex(rgbF(qc.s, qc.vals)) : ''
	const offer = qc ? `<button class="offer" type="button" data-setq><i style="background:${qhex}"></i>Use <b>${esc(S.q)}</b> as the current color<kbd>↵</kbd></button>` : ''

	const go = e.target.closest('[data-go]'); if (go) { e.preventDefault(); if (go.dataset.go) { openPane(go.dataset.go); reveal(go.dataset.go) } return }
	const lut = e.target.closest('[data-lut]'); if (lut) { const s = lut.dataset.lut
		try { const one = lutChannelwise(space[s], space.rgb); save(lutCube(space[s], space.rgb, one ? {} : { size: 33 }), `${s}-to-rgb${one ? '' : '-33'}.cube`, 'text/plain'); toast('LUT saved') } catch { toast('No LUT for this pair') } return }
	const icc = e.target.closest('[data-icc]'); if (icc) { const s = icc.dataset.icc; try { save(iccProfile(space[s], { xyz: space.xyz }), `${s}.icc`, 'application/vnd.iccprofile'); toast('ICC saved') } catch { toast('No profile for this space') } return }
	// the welcome's links: #space opens its page, #notation sets the color – the main page's grammar
	const a = e.target.closest('a[href^="#"]'); if (a) { e.preventDefault(); const h = decodeURIComponent(a.getAttribute('href').slice(1))
		if (SPACES.includes(h)) { openPane(h, { push: true }); reveal(h) } else { const c = parseColor(h); if (c) setColor(c.s, c.vals) } } })
const save = (data, name, type) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000) }
// the pane's width is the reader's: drag its edge, double-click to reset
$('pane').addEventListener('pointerdown', e => { const h = e.target.closest('.rsz'); if (!h) return; e.preventDefault(); h.classList.add('drag')
	const mv = ev => { const w = clamp(innerWidth - ev.clientX, 320, innerWidth * .62); document.documentElement.style.setProperty('--panew', w + 'px') }
	const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); h.classList.remove('drag'); store.set('twPaneW', document.documentElement.style.getPropertyValue('--panew')); paintPane(true) }
	addEventListener('pointermove', mv); addEventListener('pointerup', up) })
$('pane').addEventListener('dblclick', e => { if (!e.target.closest('.rsz')) return; document.documentElement.style.removeProperty('--panew'); store.set('twPaneW', '') })
if (store.get('twPaneW')) document.documentElement.style.setProperty('--panew', store.get('twPaneW'))
// keyboard: / search · arrows walk the shelf (the page follows) · Enter gives the page the workspace · Esc unwinds
const colsOf = () => { const g = $('cat').querySelector('.grid,.list'); return g ? getComputedStyle(g).gridTemplateColumns.split(' ').length : 1 }
const reveal = s => { if (!s) return; const el = $('cat').querySelector(`[data-s="${CSS.escape(s)}"]`); el?.scrollIntoView({ block: 'nearest' }) }
const focusSel = () => { $('cat').querySelector(`[data-s="${CSS.escape(S.sel || '')}"] .nm`)?.focus({ preventScroll: true }) }
document.addEventListener('keydown', e => {
	if ((e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) && !e.target.closest('input,select,textarea')) { e.preventDefault(); $('q').focus(); $('q').select(); return }
	if (e.key === 'Escape' && !e.target.closest('input')) { if (S.focus) openPane(S.sel, { focus: false, push: true }); else if (S.pane) closePane(false); return }
	if (e.target.closest('input,select,textarea') || e.metaKey || e.ctrlKey || e.altKey) return
	const onShelf = e.target === document.body || !!e.target.closest('#cat,#pane')   // the walk belongs to the shelf and the page, never to the rail's or header's own buttons
	if (!onShelf || e.target.closest('pre')) return
	if (e.key === 'Enter' && (e.target === document.body || e.target.closest('#cat .nm'))) { const it = e.target.closest('#cat [data-s]')
		if (it && it.dataset.s !== S.sel) { e.preventDefault(); openPane(it.dataset.s); return }   // a tile reached by Tab opens first; the next Enter expands it
		if (S.sel) { e.preventDefault(); openPane(S.sel, { focus: !S.focus, push: true }) } return }
	const k = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -(S.view === 'table' || S.focus ? 1 : colsOf()), ArrowDown: S.view === 'table' || S.focus ? 1 : colsOf() }[e.key]
	if (!k || !FLAT.length || e.target.closest('.pl,.plate,.solid-wrap')) return
	if (S.focus && Math.abs(k) !== 1) return
	e.preventDefault(); let i = FLAT.indexOf(S.sel); i = i < 0 ? 0 : clamp(i + (S.focus && e.key === 'ArrowUp' ? -1 : k), 0, FLAT.length - 1)
	if (FLAT[i] !== S.sel) { openPane(FLAT[i]); reveal(FLAT[i]); focusSel() } })
addEventListener('popstate', () => boot(false))
let sizeFrame=0
new ResizeObserver(()=>{cancelAnimationFrame(sizeFrame);sizeFrame=requestAnimationFrame(()=>{if(S.sel)paintPane(true)})}).observe($('pane'))
let readyFrame=0
setGLReady(() => { if(readyFrame)return; readyFrame=requestAnimationFrame(()=>{readyFrame=0;const box=$('cat').getBoundingClientRect(), r={top:Math.max(0,box.top),bottom:Math.min(innerHeight,box.bottom)};$('cat').querySelectorAll('.featured').forEach(el=>{const b=el.getBoundingClientRect();if(b.bottom>r.top&&b.top<r.bottom)paintPlanes(el,el.dataset.s,true,'off',false)});if(S.sel)paintPane(true)}) })

// ── boot: the URL speaks first – #color, ?s= the space ──
function boot(first = true) {
	const P = new URLSearchParams(location.search), h = decodeURIComponent(location.hash.slice(1))
	const c = h && !SPACES.includes(h) ? parseColor(h) : null; if (c) { S.space = c.s; S.vals = c.vals; syncRGB() }
	const s = P.get('s') || (SPACES.includes(h) ? h : null); S.focus = P.has('focus')
	S.style=pick(P.get('style'),Object.keys(STYLE_NOTES),'quiet'); S.preview=pick(P.get('preview'),['sliders','planes'],'planes'); S.view=pick(P.get('v'),['grid','list','table'],'grid'); S.arrange=pick(P.get('a'),['family','purpose','era','name'],'family'); render()
	paintCur()
	if (s && SPACES.includes(s)) { openPane(s, { focus: S.focus }); reveal(s) }
	else if (S.pane && !NARROW.matches) openPane(null)   // the welcome sits beside the catalog – it never covers it
	else closePane(false) }
drawTheme(); boot()
</script>
</body>
