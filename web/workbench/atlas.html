<!doctype html>
<html lang="en" data-top="drawer" data-hero="search" data-lay="center" data-burst="plane">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas – color-space workbench</title>
<meta name="description" content="Workbench direction Atlas: catalog-first – the family titles are the navigation, featured spaces lead each family, the live dossier docks beside it. A workshop for the hero.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2.34' y='2.34' width='11.32' height='11.32' fill='%23ef7a4a' transform='rotate(45 8 8)'/></svg>">
<link rel="preload" href="../fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../variants.css">
<link rel="stylesheet" href="./wb.css">
<link rel="stylesheet" href="./atlas.css">
<link rel="stylesheet" href="./top-drawer.css">
<link rel="stylesheet" href="./lineage.css">
<!-- the hero variant's stylesheet: ?hero=<key> picks it before first paint (atlas.js swaps it live; its HEROS list is the one to extend) -->
<link rel="stylesheet" href="./hero-search.css" id="herocss">
<script>try{document.documentElement.dataset.theme=localStorage.csTheme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch{}
try{const k=new URLSearchParams(location.search).get('hero');if(/^[a-z]+$/.test(k||'')){document.documentElement.dataset.hero=k;document.getElementById('herocss').href='./hero-'+k+'.css'}}catch{}</script>
</head>
<body>
<a class="skip" href="#cat">Skip to the spaces</a>

<!-- the page beside the dock – a size container: a variant asks @container page (…) how much room it has -->
<div class="page">
<!-- the masthead (pinned), the hero a variant fills (atlas.js documents the contract), then the atlas: the Drawer's cells and the catalog -->
<div id="top"></div>
<section id="hero" aria-label="color-space" data-wstay></section>
<div id="cells"></div>

<!-- the catalog: each family's title is its own heading and, on wide screens, a rung of the ladder -->
<div class="work"><main id="cat" aria-label="Color spaces"></main></div>
<!-- after the atlas: its history – every space a band from its year (lineage.js) -->
<section class="work" id="lineage" aria-label="The history of color spaces" data-wstay></section>

<footer class="foot">
	<div class="fin">
		<div class="row">
			<span class="lab" aria-hidden="true"></span>
			<div class="fcols">
				<section aria-labelledby="f-npm"><h2 class="flab" id="f-npm">Install</h2><div id="f-npm-p"></div></section>
				<section aria-labelledby="f-mcp"><h2 class="flab" id="f-mcp">For agents</h2><div id="f-mcp-p"></div>
					<p class="fmore"><button type="button" class="flnk" popovertarget="a-agents">Set up Claude Code, Claude Desktop, Cursor or VS Code</button></p></section>
			</div>
		</div>
		<div class="row">
			<span class="lab" aria-hidden="true"></span>
			<p class="legal"><button type="button" class="flnk" popovertarget="a-cite">Cite</button><a href="https://github.com/sponsors/dy">Support the project</a><a href="https://github.com/colorjs/color-space/blob/master/license.md" title="CC0 1.0 – public domain">CC0</a><a href="https://github.com/colorjs/color-space">GitHub</a><a href="./">Workbench</a><a class="om" href="https://github.com/krishnized/license" title="Krishnized license">ॐ</a></p>
		</div>
	</div>
</footer>
</div>

<!-- native popovers – the top layer, no positioning script (index.html's Cite) -->
<div class="apop" id="a-cite" popover role="dialog" aria-labelledby="a-cite-t"><h2 class="ptl" id="a-cite-t">Cite color-space</h2><div id="a-cite-b" aria-live="polite"><p class="wb-note">…</p></div></div>
<div class="apop" id="a-agents" popover role="dialog" aria-labelledby="wb-ag-t"><div data-wb="agents"></div></div>

<!-- the workbench's own pane stays mounted but unused here (its painters expect it); the details are the live dossier -->
<aside id="pane" hidden></aside>
<!-- the dossier: index.html's modal – its card (index.html?s=<space>&embed, chrome-free) over the lit page, the page
     layer scrolling it, the masthead live above; the card's foot walks the neighbours as the site's does -->
<dialog class="dock" id="dock" aria-labelledby="dock-t"><div class="dbox">
	<h2 class="sr" id="dock-t"></h2>
	<button class="dx" type="button" data-close aria-label="Close the dossier" id="dock-x"></button>
	<div class="dfr"><p class="dload" id="dock-load" role="status">Opening the dossier…</p></div>
	<nav class="mnavbar mfoot" aria-label="Adjacent color spaces">
		<span class="ngrp"><button class="mnav mcat prev" type="button" id="dock-pc"></button><button class="mnav prev" type="button" data-go="-1" id="dock-prev"></button></span>
		<span class="ngrp"><button class="mnav next" type="button" data-go="1" id="dock-next"></button><button class="mnav mcat next" type="button" id="dock-nc"></button></span>
	</nav>
</div></dialog>

<!-- the workshop: which hero, and the search hero's layout and burst – each rides the URL (?hero= ?lay= ?burst=);
     the color, filters, open space and scroll stay -->
<nav class="study" aria-label="Workshop">
	<div class="study-g"><span>Hero</span><div class="study-options" id="heros"></div></div>
	<div class="study-g"><span>Layout</span><div class="study-options" id="lays"></div></div>
	<div class="study-g"><span>Burst</span><div class="study-options" id="bursts"></div></div>
</nav>

<script type="module" src="./atlas.js"></script>
</body>
</html>
