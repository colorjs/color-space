<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Color spaces — atlas study</title>
<meta name="description" content="Browse and compare the color-space atlas in gallery, list, and table views.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2.34' y='2.34' width='11.32' height='11.32' fill='%23ef7a4a' transform='rotate(45 8 8)'/></svg>">
<script>document.documentElement.dataset.theme=localStorage.csTheme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<style>
/* An Apple-genre catalogue study — system face, translucent chrome, soft depth, one
   selection blue. Self-contained on purpose: the main site's tokens.css idiom stays
   on the main page; this page speaks Font Book. */
:root{
	color-scheme:light;
	interpolate-size:allow-keywords;
	--railw:13.5rem; --inspw:22rem;
	--zoom:.35;
	--tw:calc(9rem + var(--zoom)*13.5rem);        /* gallery column width, fed by the A-slider — zooms out to icon-size tiles */
	--rowh:calc(18px + var(--zoom)*14px);         /* list/inspector strip height, same slider */
	--dark:#1d1d1f;                               /* theme-static dark — the tick ring pair flips against the FILL, not the theme */
	--bg:#f5f5f7; --content:#ffffff; --panel:#ffffff; --chrome:rgba(246,246,248,.85); --line:rgba(0,0,0,.08);
	--tile:#ffffff; --tile-line:rgba(0,0,0,.09);
	--ink:#1d1d1f; --body:#48484a; --soft:#6e6e73; --ghost:#aeaeb2;
	--sel:#0a63ff; --sel-soft:#dbe7fd; --hover:rgba(0,0,0,.045); --stripe:rgba(0,0,0,.03);
	--seg:rgba(120,120,128,.12); --seg-on:#ffffff;
	--err:#d92d20; --star:#f0a500;
	--checker:repeating-conic-gradient(rgba(0,0,0,.07) 0% 25%, transparent 0% 50%) 0 0/12px 12px;
	--r:20px; --rs:10px;
	--sh-sm:0 1px 2px rgba(0,0,0,.05);
	--sh-md:0 2px 6px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.07);
	--sh-pop:0 12px 40px rgba(0,0,0,.16), 0 2px 8px rgba(0,0,0,.08);
	--ease:cubic-bezier(.25,.1,.25,1); --fast:140ms;
}
[data-theme="dark"]{
	color-scheme:dark;
	--bg:#1c1c1e; --content:#1c1c1e; --panel:#2c2c2e; --chrome:rgba(28,28,30,.85); --line:rgba(255,255,255,.1);
	--tile:#2c2c2e; --tile-line:rgba(255,255,255,.1);
	--ink:#f5f5f7; --body:#d1d1d6; --soft:#98989d; --ghost:#636366;
	--sel:#3a7bfd; --sel-soft:#1c3966; --hover:rgba(255,255,255,.06); --stripe:rgba(255,255,255,.035);
	--seg:rgba(120,120,128,.26); --seg-on:#5a5a5e;
	--err:#f97066;
	--checker:repeating-conic-gradient(rgba(255,255,255,.08) 0% 25%, transparent 0% 50%) 0 0/12px 12px;
	--sh-sm:0 1px 2px rgba(0,0,0,.3);
	--sh-md:0 2px 8px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.4);
	--sh-pop:0 12px 40px rgba(0,0,0,.55), 0 2px 8px rgba(0,0,0,.4);
}
*{ box-sizing:border-box; margin:0 }
html,body{ height:100%; overflow-x:clip }
body{ overflow:hidden; background:var(--bg); color:var(--ink); font:13px/1.45 -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif; -webkit-font-smoothing:antialiased }
button,input,select{ color:inherit; font:inherit }
button{ padding:0; border:0; background:none; cursor:pointer }
button,input,select,a{ -webkit-tap-highlight-color:transparent }
button:disabled{ cursor:not-allowed; opacity:.4 }
a{ color:inherit }
:focus-visible{ outline:2px solid var(--sel); outline-offset:2px }
[hidden]{ display:none!important }
.tnum{ font-variant-numeric:tabular-nums }
code{ font-family:ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; font-size:.92em }
mark{ background:color-mix(in srgb, var(--sel) 26%, transparent); border-radius:3px; color:inherit }
/* overlay-quiet scrollbars — content keeps the space */
.scroll,.side,#insp,.tblw,.doss{ scrollbar-width:thin; scrollbar-color:color-mix(in srgb, var(--ink) 22%, transparent) transparent }
.scroll::-webkit-scrollbar,.side::-webkit-scrollbar,#insp::-webkit-scrollbar,.tblw::-webkit-scrollbar,.doss::-webkit-scrollbar{ width:9px; height:9px; background:transparent }
.scroll::-webkit-scrollbar-thumb,.side::-webkit-scrollbar-thumb,#insp::-webkit-scrollbar-thumb,.tblw::-webkit-scrollbar-thumb,.doss::-webkit-scrollbar-thumb{ background:color-mix(in srgb, var(--ink) 22%, transparent); border:2.5px solid transparent; border-radius:9px; background-clip:padding-box }
.app{ display:grid; grid-template-rows:auto minmax(0,1fr); height:100dvh }
/* squircle corners where supported; plain rounding elsewhere */
.card .tile,.row,.tblw,.cfg .menu,.curmsg,.plbox canvas,.insp .viz canvas,.empty button,.dpanel{ corner-shape:squircle }

/* ── toolbar: identity · color · size · render · views · search · theme ── */
.bar{ position:relative; z-index:30; display:grid; grid-template-areas:"id cur gh theme" "views find find find"; grid-template-columns:minmax(0,1fr) auto auto auto; align-items:center; gap:8px 10px; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--chrome); backdrop-filter:blur(20px) saturate(180%); -webkit-backdrop-filter:blur(20px) saturate(180%) }
.bar .id{ grid-area:id; display:flex; min-width:0; align-items:center; gap:9px; text-decoration:none }
.bar .id .diamond{ flex:none; width:12px; height:12px; transform:rotate(45deg); border-radius:2.5px; background:var(--cur,#ef7a4a); box-shadow:inset 0 0 0 1px rgba(0,0,0,.12) }
.bar .id h1{ overflow:hidden; font-size:15px; font-weight:700; letter-spacing:-.01em; line-height:1.15; text-overflow:ellipsis; white-space:nowrap }
.bar .id small{ display:none; color:var(--soft); font-size:11px; font-weight:500; white-space:nowrap }
.seg{ display:flex; padding:2px; border-radius:9px; background:var(--seg) }
.seg button{ display:grid; width:36px; height:26px; place-items:center; border-radius:7px; color:var(--soft); transition:color var(--fast) var(--ease), background-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease) }
.seg button:hover{ color:var(--ink) }
.seg button[aria-pressed="true"]{ background:var(--seg-on); color:var(--ink); box-shadow:0 1px 2.5px rgba(0,0,0,.16) }
.vseg2{ grid-area:views }
.qseg{ grid-area:quant; display:none }
.zoom{ grid-area:zoom; display:none; align-items:center; gap:7px; color:var(--soft) }
.zoom .a1{ font-size:10px } .zoom .a2{ font-size:15px }
.zoom input{ width:104px; height:26px; margin:0; padding:0; appearance:none; -webkit-appearance:none; background:transparent; cursor:ew-resize }
.zoom input::-webkit-slider-runnable-track{ height:3px; border:0; border-radius:2px; background:rgba(120,120,128,.32) }
.zoom input::-moz-range-track{ height:3px; border:0; border-radius:2px; background:rgba(120,120,128,.32) }
.zoom input::-webkit-slider-thumb{ width:15px; height:15px; margin-top:-6px; appearance:none; -webkit-appearance:none; border:0; border-radius:50%; background:#fff; box-shadow:0 .5px 2.5px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.06) }
.zoom input::-moz-range-thumb{ width:15px; height:15px; border:0; border-radius:50%; background:#fff; box-shadow:0 .5px 2.5px rgba(0,0,0,.3), 0 0 0 .5px rgba(0,0,0,.06) }
.ibtn{ display:grid; width:30px; height:30px; place-items:center; border-radius:8px; color:var(--soft); transition:color var(--fast) var(--ease), background-color var(--fast) var(--ease) }
.ibtn:hover{ background:var(--hover); color:var(--ink) }
.ibtn:active{ transform:scale(.94) }
#thm{ grid-area:theme }
#ghl{ grid-area:gh }
.sp{ grid-area:gap; display:none }
/* the current color — the subject every specimen renders — rides beside the identity */
.cur{ position:relative; grid-area:cur; display:flex; height:32px; align-items:center; gap:7px; padding:0 9px 0 5px; border:1px solid var(--line); border-radius:var(--rs); background:var(--panel); box-shadow:var(--sh-sm) }
.cur .cur-label{ display:none; color:var(--soft); font-size:11px; font-weight:600 }
.cur .sw{ position:relative; flex:none; width:22px; height:22px; border-radius:6px; background:var(--cur,#ef7a4a); box-shadow:inset 0 0 0 1px rgba(0,0,0,.14) }
.cur .sw input{ position:absolute; inset:-6px; width:calc(100% + 12px); height:calc(100% + 12px); cursor:pointer; opacity:0 }
.cur .sw input:focus{ outline:0 }
.cur .sw:has(input:focus-visible){ box-shadow:inset 0 0 0 1px rgba(0,0,0,.14), 0 0 0 3px color-mix(in srgb, var(--sel) 30%, transparent) }
.cur #chex{ min-width:0; width:7.5ch; border:0; outline:0; background:none; font-weight:600; font-variant-numeric:tabular-nums; text-transform:uppercase }
.cur:focus-within{ border-color:var(--sel); box-shadow:0 0 0 3px color-mix(in srgb, var(--sel) 18%, transparent) }
.cur:has(#chex[aria-invalid="true"]){ border-color:var(--err); box-shadow:0 0 0 3px color-mix(in srgb, var(--err) 18%, transparent) }
.curmsg{ position:absolute; right:0; top:calc(100% + 8px); z-index:40; width:max-content; max-width:36ch; padding:7px 10px; border-radius:8px; background:var(--ink); color:var(--bg); font-size:11.5px; box-shadow:var(--sh-pop) }
.find{ position:relative; grid-area:find; height:32px }
.find svg{ position:absolute; left:9px; top:50%; width:13px; height:13px; transform:translateY(-50%); fill:none; stroke:var(--soft); stroke-linecap:round; stroke-width:2; pointer-events:none }
.find input{ width:100%; height:100%; padding:0 28px; border:1px solid var(--line); border-radius:var(--rs); background:var(--panel); outline:0; box-shadow:var(--sh-sm) }
.find input::placeholder{ color:var(--ghost); opacity:1 }
.find input:focus{ border-color:var(--sel); box-shadow:0 0 0 3px color-mix(in srgb, var(--sel) 18%, transparent) }
.find .x{ position:absolute; right:6px; top:50%; display:none; width:18px; height:18px; transform:translateY(-50%); place-items:center; border-radius:50%; background:var(--ghost); color:var(--panel); font-size:9px; line-height:1 }
.find.has .x{ display:grid }

/* ── frame: collections rail · work surface · inspector · dossier page ── */
.cols{ position:relative; display:grid; grid-template-rows:auto minmax(0,1fr); min-width:0; min-height:0 }
.side{ display:flex; min-width:0; gap:4px; overflow-x:auto; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--chrome); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); scrollbar-width:none }
.side::-webkit-scrollbar{ display:none }
.side h2{ display:none }
.side button{ display:flex; flex:none; min-height:30px; align-items:center; gap:8px; padding:0 11px; border-radius:8px; white-space:nowrap; transition:background-color var(--fast) var(--ease) }
.side button:hover{ background:var(--hover) }
.side button.on{ background:var(--sel-soft) }
.side button .n{ overflow:hidden; text-overflow:ellipsis }
.side button .c{ color:var(--ghost); font-size:11px }
.side button.on .c{ color:var(--soft) }
.side .fs{ color:var(--star) }
/* tags wear a different cloth than collections: a wrapped pill cloud */
.side .tcloud{ display:flex; flex-wrap:wrap; gap:4px; padding:2px 10px 10px }
.side .tcloud button{ width:auto; min-height:24px; flex:none; padding:2px 10px; border:1px solid var(--line); border-radius:99px; font-size:11.5px; color:var(--soft) }
.side .tcloud button:hover{ background:none; color:var(--ink); border-color:var(--soft) }
.side .tcloud button.on{ background:var(--ink); border-color:transparent; color:var(--bg) }
.main{ display:flex; min-width:0; min-height:0; flex-direction:column }
/* filter row — every facet as a quiet selector (the main page's filter panel, unfolded), + sort */
.scope{ display:flex; flex:none; min-height:42px; align-items:center; gap:14px; overflow-x:auto; padding:0 14px; border-bottom:1px solid var(--line); background:var(--content); scrollbar-width:none }
.scope::-webkit-scrollbar{ display:none }
.fsel{ display:flex; flex:none; align-items:center; gap:4px }
.fsel>span{ color:var(--ghost); font-size:11px; font-weight:600 }
.scope select{ flex:none; field-sizing:content; max-width:11rem; border:0; outline:0; background:none; color:var(--soft); font-size:12.5px; font-weight:600; cursor:pointer }
.scope select.on{ color:var(--sel) }
.scope .sp{ display:block; min-width:10px; flex:1 }
.scroll{ min-height:0; flex:1; overflow-y:auto; overscroll-behavior:contain; padding:18px 18px 24px; background:var(--content) }
.empty{ display:grid; min-height:50vh; place-content:center; gap:8px; text-align:center }
.empty b{ font-size:15px }
.empty span{ color:var(--soft) }
.empty button{ justify-self:center; margin-top:6px; padding:7px 16px; border-radius:99px; background:var(--sel); color:#fff; font-weight:600 }
/* the lineage shelf cut — content is always shelved, never alphabet soup */
.gsec{ display:flex; align-items:baseline; gap:8px; margin:12px 2px 0; font-size:13px; font-weight:700; letter-spacing:-.005em }
.gsec i{ color:var(--ghost); font-size:11px; font-style:normal; font-weight:600 }
#gal>.gsec:first-child,.list>.gsec:first-child{ margin-top:0 }
/* view entrances — replayed by the view switch only, never by filtering */
.vin{ animation:vin 180ms var(--ease) }
@keyframes vin{ from{ opacity:0; transform:translateY(4px) } }

/* ── gallery — Font Book tiles: the specimen in a soft card, name beneath ── */
#gal{ display:flex; flex-direction:column; gap:calc(8px + var(--zoom)*16px) }
.ggrid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%,var(--tw)),1fr)); gap:calc(12px + var(--zoom)*26px) calc(10px + var(--zoom)*22px) }
.card{ display:flex; min-width:0; flex-direction:column; gap:7px }
.card .tile{ position:relative }
.card .face{ position:relative }
.card .face.fin{ animation:fin var(--fast) var(--ease) }
@keyframes fin{ from{ opacity:0 } }
/* the specimen IS the icon: channels joined as one rounded block, no chrome around it */
.stk{ display:flex; flex-direction:column; overflow:clip; border-radius:14px; corner-shape:squircle; transition:box-shadow var(--fast) var(--ease) }
.card.on .stk,.card.on .face.pl .plbox canvas{ box-shadow:0 0 0 2.5px var(--sel) }
.card .face .st{ --row-h:calc(12px + var(--zoom)*28px); position:relative; flex:none; height:var(--row-h); background:var(--checker); touch-action:pan-y; cursor:ew-resize }
.card .face.pl{ display:grid; place-items:center }
.plbox{ position:relative; display:block; width:100%; max-width:100%; aspect-ratio:1; margin:0 auto }
.plbox canvas{ display:block; width:100%; height:100%; border-radius:14px; background:var(--checker) }
.face.pl.disc .plbox canvas{ border-radius:50% }
.plbox canvas,.insp .viz canvas,.doss .plwrap canvas{ touch-action:none; cursor:crosshair }
/* the values ARE the caption's data — live inputs under the block */
.card .nch{ display:flex; justify-content:center; gap:9px; overflow:hidden; padding:0 4px; color:var(--soft); font-size:calc(10px + var(--zoom)*3px) }
.card .nch .mt{ color:var(--ghost); font-style:normal; font-weight:600 }
.card .nch .nv{ display:flex; gap:3px; align-items:baseline; white-space:nowrap }
.card .nch i{ color:var(--ghost); font-style:normal; font-weight:600 }
.card .nch em{ color:var(--ghost); font-style:normal }
.card .nch input{ width:4.5ch; field-sizing:content; max-width:8ch; padding:0; border:0; border-bottom:1px solid transparent; background:none; outline:0; color:var(--soft); font-size:11px; font-weight:600; transition:border-color var(--fast) var(--ease), color var(--fast) var(--ease) }
.card .nch input:hover{ border-bottom-color:var(--line); color:var(--ink) }
.card .nch input:focus{ border-bottom-color:var(--sel); color:var(--ink) }
/* the pager: bare arrows riding the block's sides — values stay, faces change */
.card .pg{ position:absolute; inset:0 -4px; display:flex; align-items:center; justify-content:space-between; pointer-events:none }
.card .pg button{ display:grid; width:21px; height:21px; place-items:center; border-radius:50%; background:color-mix(in srgb, var(--ink) 55%, transparent); color:var(--bg); font-size:12px; line-height:1; opacity:0; pointer-events:auto; transition:opacity var(--fast) var(--ease), background-color var(--fast) var(--ease), transform var(--fast) var(--ease) }
.card .tile:hover .pg button,.card .tile:focus-within .pg button{ opacity:1 }
.card .pg button:hover{ background:var(--ink) }
.card .pg button:active{ transform:scale(.92) }
.card .cap{ display:flex; min-width:0; justify-content:center; align-items:baseline; padding:0 4px; text-align:center }
.card .cap .mt{ color:var(--ghost); font-size:.85em; font-weight:600; white-space:pre }
.card .cap .nm{ max-width:100%; overflow:hidden; font-size:calc(11.5px + var(--zoom)*3px); font-weight:600; letter-spacing:-.005em; text-overflow:ellipsis; white-space:nowrap }
.card.on .cap .nm{ color:var(--sel) }
/* zoomed-in cards speak their channel symbols inside the strips */
.zoomed .card .st::after{ content:attr(data-sym); position:absolute; left:9px; top:50%; transform:translateY(-50%); color:#fff; font-size:10.5px; font-weight:700; mix-blend-mode:difference; opacity:.75; pointer-events:none }
/* icon-size zoom: the block becomes pure specimen — values step aside */
.zmin .card .nch{ display:none }
.zmin .card .cap .nm{ font-size:11.5px }

/* ── one native range recipe everywhere: the strip is the track, the tick is the main page's ── */
.st input[type="range"],.strip input[type="range"]{ --pad:0px; position:absolute; inset:calc(var(--pad)*-1) -2px; width:calc(100% + 4px); height:calc(100% + var(--pad)*2); margin:0; padding:0; appearance:none; -webkit-appearance:none; background:transparent; cursor:ew-resize; touch-action:pan-y }
.strip input[type="range"]{ --pad:4px }   /* free-standing strips take a taller overlay; stacked ones must not steal the neighbour's drags */
.st input[type="range"]::-webkit-slider-runnable-track,.strip input[type="range"]::-webkit-slider-runnable-track{ height:100%; border:0; background:transparent }
.st input[type="range"]::-moz-range-track,.strip input[type="range"]::-moz-range-track{ height:100%; border:0; background:transparent }
/* the main page's tick: a rotated square wearing the color, ringed by the color's own ink;
   the inverse ring joins on hover — the engaged pair from index.html */
.st input[type="range"]::-webkit-slider-thumb,.strip input[type="range"]::-webkit-slider-thumb{ width:11px; height:11px; margin-top:calc((var(--row-h,20px) + var(--pad,0px)*2 - 13.4px)/2); appearance:none; -webkit-appearance:none; border:1.2px solid var(--tki,var(--dark)); border-radius:0; background:var(--tkc,#fff); transform:rotate(45deg); transition:transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease) }
.st input[type="range"]::-moz-range-thumb{ width:11px; height:11px; border:1.2px solid var(--tki,var(--dark)); border-radius:0; background:var(--tkc,#fff); transform:rotate(45deg); transition:transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease) }
.strip input[type="range"]::-moz-range-thumb{ width:11px; height:11px; border:1.2px solid var(--tki,var(--dark)); border-radius:0; background:var(--tkc,#fff); transform:rotate(45deg); transition:transform var(--fast) var(--ease), box-shadow var(--fast) var(--ease) }
.st:hover input[type="range"]::-webkit-slider-thumb,.strip:hover input[type="range"]::-webkit-slider-thumb{ transform:rotate(45deg) scale(1.25); box-shadow:0 0 0 1.2px var(--tkv,transparent) }
.st:hover input[type="range"]::-moz-range-thumb,.strip:hover input[type="range"]::-moz-range-thumb{ transform:rotate(45deg) scale(1.25); box-shadow:0 0 0 1.2px var(--tkv,transparent) }
.st input[type="range"]:focus,.strip input[type="range"]:focus{ outline:0 }
.st input[type="range"]:focus-visible::-webkit-slider-thumb,.strip input[type="range"]:focus-visible::-webkit-slider-thumb{ box-shadow:0 0 0 4px color-mix(in srgb, var(--sel) 40%, transparent) }
.st input[type="range"]:focus-visible::-moz-range-thumb,.strip input[type="range"]:focus-visible::-moz-range-thumb{ box-shadow:0 0 0 4px color-mix(in srgb, var(--sel) 40%, transparent) }
/* the plane's position marker — the same tick, free of its strip, wearing the engaged pair */
.cx{ position:absolute; left:var(--px,50%); top:var(--py,50%); width:11px; height:11px; transform:translate(-50%,-50%) rotate(45deg); border:1.2px solid var(--tki,var(--dark)); background:var(--tkc,#fff); box-shadow:0 0 0 1.2px var(--tkv,transparent); pointer-events:none }

/* ── list — expandable rows, the complete labeled instrument inside ── */
.list{ display:flex; max-width:56rem; flex-direction:column; gap:10px; margin:0 auto }
.list .gsec{ margin-bottom:2px }
.row{ border:1px solid var(--tile-line); border-radius:var(--r); background:var(--tile); box-shadow:var(--sh-sm); transition:background-color var(--fast) var(--ease), border-color var(--fast) var(--ease) }
.row.on{ border-color:transparent; background:var(--sel-soft) }
.row .hd{ display:flex; width:100%; min-height:44px; align-items:center; gap:10px; padding:10px 16px; border-radius:var(--r); text-align:left }
.row .hd .dis{ flex:none; color:var(--ghost); font-size:9px; transition:transform 200ms var(--ease) }
.row.open .hd .dis{ transform:rotate(90deg) }
.row .hd .ident{ display:flex; min-width:0; align-items:baseline; gap:0 }
.row .hd .meta{ white-space:pre }
.row .hd .nm{ display:block; overflow:hidden; font-size:15px; font-weight:700; letter-spacing:-.01em; text-overflow:ellipsis; white-space:nowrap }
.row .hd .meta{ color:var(--soft); font-size:11px }
.row .hd .vals{ min-width:0; margin-left:auto; overflow:hidden; color:var(--soft); font-size:12px; text-overflow:ellipsis; white-space:nowrap }
/* disclosure that breathes: grid-rows 0fr→1fr, chevron in step */
.row .chs{ display:grid; grid-template-rows:0fr; opacity:0; visibility:hidden; transition:grid-template-rows 200ms var(--ease), opacity 200ms var(--ease), visibility 200ms }
.row.open .chs{ grid-template-rows:1fr; opacity:1; visibility:visible }
.chsw{ display:flex; min-height:0; flex-direction:column; gap:10px; overflow:hidden; padding:0 16px 0 34px; transition:padding-bottom 200ms var(--ease) }   /* border-box padding cannot compress below itself — the bottom pad animates alongside the track instead */
.row.open .chsw{ padding-bottom:16px }
.ch{ display:grid; min-width:0; align-items:center; gap:12px }
.ch:first-child{ margin-top:4px }
.ch2{ grid-template-columns:56px minmax(0,1fr) }
.ch .lb{ min-width:0; color:var(--soft); font-size:11px; line-height:1.3; text-align:right }
.ch .lb b{ display:block; color:var(--ink); font-size:13px }
.ch .lb .cn{ display:none }
.ch .lb .rng{ display:none; color:var(--ghost); font-size:10px }
.zoomed .ch .lb .rng{ display:block }
.strip{ --row-h:var(--rowh); position:relative; min-width:0; height:var(--row-h); background:var(--checker); touch-action:pan-y; cursor:ew-resize }
.strip .g{ position:absolute; inset:0 }
.ch .cv{ width:100%; height:20px; margin-top:1px; padding:0; border:0; border-bottom:1px solid transparent; border-radius:0; background:none; outline:0; color:var(--ink); font-size:12px; font-weight:600; text-align:right; transition:border-color var(--fast) var(--ease) }   /* the value lives UNDER its label, one left column */
.ch .cv:hover{ border-bottom-color:var(--line) }
.ch .cv:focus{ border-bottom-color:var(--sel) }

/* ── table — the flat record: sticky header, pair striping, channel sub-rows ── */
.tblw{ overflow-x:auto; border:1px solid var(--tile-line); border-radius:var(--r); background:var(--tile); box-shadow:var(--sh-sm) }
.tblw table{ width:100%; min-width:72ch; border-collapse:separate; border-spacing:0 }
th{ position:sticky; top:0; z-index:1; padding:9px 14px; border-bottom:1px solid var(--line); background:var(--tile); color:var(--soft); font-size:11px; font-weight:600; text-align:left; white-space:nowrap; user-select:none }
th:first-child{ border-top-left-radius:calc(var(--r) - 1px) }
th:last-child{ border-top-right-radius:calc(var(--r) - 1px) }
th[data-k]{ cursor:pointer }
th[data-k]:hover{ color:var(--ink) }
th .ar{ color:var(--ghost); font-size:8px }
td{ padding:8px 14px; font-size:13px }
tbody tr.gh td{ padding:14px 14px 5px; color:var(--ink); font-size:12px; font-weight:700 }
tbody tr.odd td{ background:var(--stripe) }
tbody tr.sr:hover td{ background:var(--hover) }
tbody tr.sr.on td{ background:var(--sel-soft) }
.trpick{ display:flex; align-items:center; gap:2px; font-weight:600; white-space:nowrap }
tbody tr.sr .dis{ display:inline-block; width:14px; color:var(--ghost); font-size:9px; transition:transform 160ms var(--ease) }
tbody tr.sr.open .dis{ transform:rotate(90deg) }
tbody tr.sub td{ padding:4px 14px 4px 44px; color:var(--soft); font-size:12px }
tbody tr.sub td b{ color:var(--ink); font-weight:600 }
td .pill{ display:inline-flex; align-items:center; padding:1px 6px; border:1px solid currentColor; border-radius:5px; color:var(--sel); font-size:10px; font-weight:700; letter-spacing:.03em; line-height:1.5 }
.tag{ display:inline-flex; align-items:center; padding:2px 9px; border:1px solid var(--line); border-radius:99px; color:var(--soft); font-size:11px; font-style:normal; font-weight:600; line-height:1.5 }
.cfgth{ text-align:right }
.cfg{ position:relative }
.cfg>button{ padding:2px 6px; border-radius:6px; color:var(--soft); font-size:11px; font-weight:600 }
.cfg>button:hover{ background:var(--hover); color:var(--ink) }
/* the menu grows from its trigger corner */
.cfg .menu{ position:absolute; right:0; top:calc(100% + 6px); z-index:40; display:none; min-width:11.5rem; flex-direction:column; gap:1px; padding:6px; border:1px solid var(--line); border-radius:12px; background:var(--panel); box-shadow:var(--sh-pop); opacity:0; transform:scale(.96); transform-origin:top right; transition:opacity 150ms var(--ease), transform 150ms var(--ease), display 150ms allow-discrete }
.cfg.open .menu{ display:flex; opacity:1; transform:none; @starting-style{ opacity:0; transform:scale(.96) } }
.cfg .menu label{ display:flex; min-height:28px; align-items:center; gap:8px; padding:0 8px; border-radius:6px; color:var(--ink); font-size:12.5px; font-weight:400; letter-spacing:0; text-transform:none; white-space:nowrap; cursor:pointer }
.cfg .menu label:hover{ background:var(--hover) }
.cfg .menu input{ accent-color:var(--sel) }

/* ── inspector — always present; resizable at full width ── */
#insp{ position:fixed; inset:0 0 0 auto; z-index:50; width:min(100%,var(--inspw)); min-width:0; overflow-y:auto; overflow-x:clip; overscroll-behavior:contain; padding:16px 16px 32px; border-left:1px solid var(--line); background:var(--panel); box-shadow:var(--sh-pop); opacity:0; pointer-events:none; transform:translateX(100%) }
.cols.ready #insp{ transition:transform 240ms var(--ease), opacity 240ms var(--ease) }
.cols.insp>#insp{ opacity:1; pointer-events:auto; transform:none }
.rsz{ display:none }
.ihead{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px }
.ihead .hgrow{ min-width:0; flex:1 }
.insp h2{ min-width:0; overflow-wrap:anywhere; font-size:17px; font-weight:700; letter-spacing:-.015em; line-height:1.2 }
.insp .sub{ margin-top:3px; color:var(--soft); font-size:11.5px }
.mx{ display:grid; flex:none; width:26px; height:26px; place-items:center; border-radius:50%; background:var(--hover); color:var(--soft); font-size:11px }
.mx:hover{ color:var(--ink) }
.star svg{ width:14px; height:14px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linejoin:round }
.star[aria-pressed="true"]{ color:var(--star) }
.star[aria-pressed="true"] svg{ fill:currentColor }
.dpills{ display:flex; flex-wrap:wrap; gap:5px; margin-top:10px }
.dhr{ margin:14px 0; border-top:1px solid var(--line) }
.props{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px }
.props>div{ min-width:0 }
.props b{ display:block; overflow:hidden; font-size:15px; font-weight:700; letter-spacing:-.01em; text-overflow:ellipsis; white-space:nowrap }
.props b a{ color:var(--sel); font-size:13px; text-decoration:none }
.props b a:hover{ text-decoration:underline }
.props span{ display:block; margin-top:2px; color:var(--soft); font-size:10.5px; line-height:1.35 }
.desc{ margin-top:14px; color:var(--body); font-size:12.5px; line-height:1.55 }
.used{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:10px; margin:14px 0; padding:10px 12px; border-radius:10px; background:var(--bg); color:var(--body); font-size:12px }
.used b{ color:var(--ink); font-size:11px; font-weight:600; white-space:nowrap }
.insp .vseg{ display:flex; margin-bottom:12px; padding:2px; border-radius:8px; background:var(--seg) }
.insp .vseg button{ flex:1; padding:4px 0; border-radius:6px; color:var(--soft); font-size:12px; font-weight:600; transition:color var(--fast) var(--ease), background-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease) }
.insp .vseg button[aria-pressed="true"]{ background:var(--seg-on); color:var(--ink); box-shadow:0 1px 2.5px rgba(0,0,0,.16) }
.insp .viz{ margin-bottom:14px }
.insp .viz .chs{ display:flex; flex-direction:column; gap:10px }
.insp .viz .ch{ grid-template-columns:52px minmax(0,1fr) }
.insp .viz .ch .lb{ color:var(--ink); font-size:12px; font-weight:700; text-align:right }
.insp .viz .ch .lb .cv{ color:var(--soft); font-weight:600 }
.insp .viz .plwrap{ position:relative; width:min(100%,260px); aspect-ratio:1; margin:4px auto 0 }
.insp .viz canvas{ display:block; width:100%; height:100%; border-radius:12px; background:var(--checker) }
.insp .viz.disc canvas{ border-radius:50% }
.insp details{ border-top:1px solid var(--line) }
.insp summary{ display:flex; min-height:38px; align-items:center; justify-content:space-between; color:var(--ink); font-size:12.5px; font-weight:600; cursor:pointer; list-style:none }
.insp summary::-webkit-details-marker{ display:none }
.insp summary::after{ color:var(--ghost); content:"›"; font-size:13px; transform:rotate(90deg); transition:transform 160ms var(--ease) }
.insp details:not([open]) summary::after{ transform:none }
.insp details::details-content{ opacity:0; block-size:0; overflow:clip; transition:block-size 220ms var(--ease), opacity 220ms var(--ease), content-visibility 220ms allow-discrete }
.insp details[open]::details-content{ opacity:1; block-size:auto }
.insp .kv{ display:grid; gap:10px; padding:0 0 14px; font-size:12px }
.insp .kv .k{ display:block; margin-bottom:1px; font-weight:600 }
.insp .kv .v{ color:var(--soft); overflow-wrap:anywhere }
.insp .kv .v a{ color:var(--sel); text-decoration:none }
.insp .kv .v a:hover{ text-decoration:underline }
.insp .chtab{ width:100%; margin-bottom:14px; border-collapse:collapse; table-layout:fixed }   /* fixed layout: the name cell yields, the record never scrolls sideways */
.insp .chtab td{ padding:6px 0; border-top:1px solid var(--line); font-size:12px }
.insp .chtab tr:first-child td{ border-top:0 }
.insp .chtab td:nth-child(2){ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.insp .chtab .sy{ width:26px; font-weight:700 }
.insp .chtab .rg{ width:9.5em; color:var(--soft); font-size:11px; text-align:right; white-space:nowrap }
.rel{ display:flex; flex-wrap:wrap; gap:5px; padding:0 0 14px }
.rel button{ padding:2px 9px; border:1px solid var(--line); border-radius:99px; color:var(--soft); font-size:11px; font-weight:600; transition:color var(--fast) var(--ease), border-color var(--fast) var(--ease) }
.rel button:hover{ color:var(--ink); border-color:var(--soft) }

/* ── the dossier — the content area becomes the space's page; rail, filters and record stay ── */
.doss{ display:none; min-height:0; flex:1; overflow-y:auto; overscroll-behavior:contain; background:var(--content) }
.cols.dossmode .scroll{ display:none }
.cols.dossmode .doss{ display:block; animation:vin 200ms var(--ease) }
.dhead{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--chrome); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px) }
.dhead .back{ display:flex; align-items:center; gap:3px; padding:4px 10px 4px 6px; border-radius:8px; color:var(--sel); font-size:13px; font-weight:600 }
.dhead .back:hover{ background:var(--hover) }
.dhead .dtit{ display:flex; min-width:0; align-items:baseline; gap:9px }
.dhead h2{ overflow:hidden; font-size:16px; font-weight:700; letter-spacing:-.01em; text-overflow:ellipsis; white-space:nowrap }
.dhead .sub{ color:var(--soft); font-size:11.5px; white-space:nowrap }
.dhead .spx{ flex:1 }
.dhead .xmeta{ color:var(--soft); font-size:11.5px; white-space:nowrap }
.dhead .xmeta a{ color:var(--sel); text-decoration:none }
.dhead .xmeta a:hover{ text-decoration:underline }
.dbody{ display:grid; max-width:76rem; grid-template-columns:minmax(0,1fr); gap:18px; margin:0 auto; padding:18px 18px 48px }
.dpanel{ border:1px solid var(--tile-line); border-radius:var(--r); background:var(--tile); box-shadow:var(--sh-sm); padding:16px }
.dpanel h4{ margin:0 0 10px; color:var(--soft); font-size:11px; font-weight:700; letter-spacing:.02em; text-transform:uppercase }
.doss .d3d canvas{ display:block; width:100%; max-width:380px; aspect-ratio:1; margin:0 auto; touch-action:none; cursor:grab }
.doss .d3d canvas:active{ cursor:grabbing }
.doss .dnote{ margin-top:6px; color:var(--ghost); font-size:10.5px; text-align:center }
.doss .plwrap{ position:relative; width:min(100%,380px); aspect-ratio:1; margin:0 auto }
.doss .plwrap canvas{ display:block; width:100%; height:100%; border-radius:12px; background:var(--checker) }
.doss .dpl.disc .plwrap canvas{ border-radius:50% }
.doss .axes{ display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-top:10px }
.doss .axes button{ padding:2px 9px; border:1px solid var(--line); border-radius:99px; color:var(--soft); font-size:11px; font-weight:600 }
.doss .axes button:hover{ color:var(--ink) }
.doss .axes button[aria-pressed="true"]{ border-color:transparent; background:var(--ink); color:var(--bg) }
.doss .chs{ display:flex; flex-direction:column; gap:12px }
.doss .chs .strip{ --row-h:26px }
.doss .chs .cv{ height:24px; font-size:15px }
.doss .chs .lb b{ font-size:15px }
.doss .mix{ position:relative; height:24px; background:var(--checker); margin-bottom:4px }
.doss .mix .g{ position:absolute; inset:0 }
.doss .mixnote{ color:var(--ghost); font-size:10.5px }
.doss .ddesc{ color:var(--body); font-size:12.5px; line-height:1.55 }
.doss .prof{ display:grid; grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr)); gap:10px 14px; font-size:12px }
.doss .prof b{ display:block; color:var(--ink); font-weight:600; font-size:11px }
.doss .prof span{ color:var(--soft); overflow-wrap:anywhere }
.doss .chtab2{ width:100%; border-collapse:collapse; font-size:12px }
.doss .chtab2 td{ padding:6px 0; border-top:1px solid var(--line) }
.doss .chtab2 tr:first-child td{ border-top:0 }
.doss .chtab2 .sy{ width:30px; font-weight:700 }
.doss .chtab2 .rg{ color:var(--soft); text-align:right; white-space:nowrap }
@media (min-width:64rem){
	.dbody{ grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); align-items:start }
	.dcol1,.dcol2{ display:flex; flex-direction:column; gap:18px; min-width:0 }
}

@media (hover:none){
	.card .pg button{ opacity:1 }
}
@media (pointer:coarse){
	.seg button{ width:40px; height:32px }
	.ibtn{ width:36px; height:36px }
	.side button{ min-height:36px }
	.card .pg button{ width:28px; height:28px }
	.card .face .st{ --row-h:calc(16px + var(--zoom)*28px) }
}
@media (min-width:40rem){
	.bar .id small{ display:block }
	.scroll{ padding:22px }
	.chsw{ padding-left:44px }
	.ch2{ grid-template-columns:9.5rem minmax(0,1fr) }
	.ch .lb .cn{ display:block }
}
@media (min-width:60rem){
	.cols{ grid-template-rows:minmax(0,1fr); grid-template-columns:var(--railw) minmax(0,1fr) }
	.side{ min-height:0; flex-direction:column; gap:2px; overflow:hidden auto; padding:10px 8px; border-right:1px solid var(--line); border-bottom:0 }
	.side h2{ display:block; padding:14px 11px 4px; color:var(--ghost); font-size:11px; font-weight:600 }
	.side button{ width:100%; flex:none; justify-content:flex-start; text-align:left }
	.side button .n{ flex:1 }
	.scope{ padding:0 22px }
	.scroll{ padding:22px }
	.tblw{ overflow:visible }
}
@media (min-width:70rem){
	.bar{ grid-template-areas:"id cur gap zoom quant views find gh theme"; grid-template-columns:minmax(0,max-content) auto minmax(12px,1fr) auto auto auto minmax(12rem,19rem) auto auto; padding:8px 14px }
	.zoom{ display:flex }
	.qseg{ display:flex }
	.sp{ display:block }
	.cur .cur-label{ display:block }
}
@media (min-width:80rem){
	.cols,.cols.insp{ grid-template-columns:var(--railw) minmax(0,1fr) var(--inspw) }
	#insp{ position:relative; inset:auto; z-index:auto; display:block; width:auto; min-height:0; box-shadow:none; opacity:1; pointer-events:auto; transform:none; transition:none; background:var(--chrome); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px) }
	.insp .mx.iclose{ display:none }
	/* the record's width is the reader's to set */
	.rsz{ display:block; position:absolute; inset:0 auto 0 0; z-index:2; width:9px; cursor:col-resize }
	.rsz::after{ content:""; position:absolute; inset:0 auto 0 3px; width:2px; background:transparent; transition:background-color var(--fast) var(--ease) }
	.rsz:hover::after,.rsz.drag::after{ background:var(--sel) }
}
@media (prefers-reduced-motion:reduce){
	*,*::before,*::after{ transition-duration:.01ms!important; animation:none!important; scroll-behavior:auto!important }
}
@media (prefers-reduced-transparency:reduce){
	.bar,.side,#insp,.dhead{ background:var(--bg); backdrop-filter:none; -webkit-backdrop-filter:none }
}
@media (prefers-contrast:more){
	:root{ --line:rgba(0,0,0,.3); --tile-line:rgba(0,0,0,.32) }
	[data-theme="dark"]{ --line:rgba(255,255,255,.36); --tile-line:rgba(255,255,255,.38) }
}
</style>
</head>
<body>
<div class="app">
	<header class="bar">
		<a class="id" href="./" aria-label="Open the current color-space atlas"><i class="diamond" aria-hidden="true"></i><span><h1>color-space</h1><small id="count" aria-live="polite">spaces</small></span></a>
		<div class="cur" title="The current color — every space below renders it">
			<span class="cur-label">Color</span><span class="sw" id="csw"><input type="color" id="cpick" aria-label="Pick the current color"></span>
			<input id="chex" class="tnum" spellcheck="false" autocomplete="off" aria-label="Current color as hexadecimal" aria-describedby="curmsg">
			<span class="curmsg" id="curmsg" role="status" hidden>Use six hexadecimal digits, for example #F67D4F.</span>
		</div>
		<span class="sp"></span>
		<div class="zoom" title="Preview density"><span class="a1">A</span><input id="zoom" type="range" min="0" max="1" step="any" value=".35" aria-label="Preview density"><span class="a2">A</span></div>
		<div class="seg qseg" role="group" aria-label="Rendering">
			<button id="q-smooth" aria-pressed="true" title="Smooth"><svg width="15" height="15" viewBox="0 0 15 15" aria-hidden="true"><defs><linearGradient id="qs" x1="0" x2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".15"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs><rect x="1" y="4.5" width="13" height="6" rx="2" fill="url(#qs)"/></svg></button>
			<button id="q-steps" aria-pressed="false" title="Stepped"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><rect x="1" y="4.5" width="3" height="6" opacity=".25"/><rect x="4.33" y="4.5" width="3" height="6" opacity=".5"/><rect x="7.66" y="4.5" width="3" height="6" opacity=".75"/><rect x="11" y="4.5" width="3" height="6"/></svg></button>
			<button id="q-web" aria-pressed="false" title="Web-safe"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><circle cx="3" cy="3" r="1.4"/><circle cx="7.5" cy="3" r="1.4"/><circle cx="12" cy="3" r="1.4"/><circle cx="3" cy="7.5" r="1.4"/><circle cx="7.5" cy="7.5" r="1.4"/><circle cx="12" cy="7.5" r="1.4"/><circle cx="3" cy="12" r="1.4"/><circle cx="7.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/></svg></button>
		</div>
		<div class="seg vseg2" role="group" aria-label="Catalogue view">
			<button id="v-gal" aria-pressed="true" title="Gallery" aria-label="Gallery view"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><rect x="0" y="0" width="6.5" height="6.5" rx="1.5"/><rect x="8.5" y="0" width="6.5" height="6.5" rx="1.5"/><rect x="0" y="8.5" width="6.5" height="6.5" rx="1.5"/><rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1.5"/></svg></button>
			<button id="v-list" aria-pressed="false" title="List" aria-label="List view"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><rect x="0" y="1" width="15" height="5.5" rx="1.5"/><rect x="0" y="8.5" width="15" height="5.5" rx="1.5" opacity=".45"/></svg></button>
			<button id="v-tbl" aria-pressed="false" title="Table" aria-label="Table view"><svg width="15" height="15" viewBox="0 0 15 15" fill="currentColor" aria-hidden="true"><rect x="0" y="1" width="15" height="2.6" rx="1.3"/><rect x="0" y="6.2" width="15" height="2.6" rx="1.3"/><rect x="0" y="11.4" width="15" height="2.6" rx="1.3"/></svg></button>
		</div>
		<div class="find" id="findw">
			<svg viewBox="0 0 15 15" aria-hidden="true"><circle cx="6.5" cy="6.5" r="4.5"/><path d="M10 10l3.5 3.5"/></svg>
			<input id="q" type="search" placeholder="Search color spaces" aria-label="Search color spaces">
			<button class="x" id="qx" aria-label="Clear search">✕</button>
		</div>
		<a class="ibtn" id="ghl" href="https://github.com/colorjs/color-space" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub repository"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>
		<button class="ibtn" id="thm" aria-pressed="false" title="Change theme" aria-label="Switch theme"></button>
	</header>

	$('doss').scrollTop = 0
	paintDoss()
	if (push) { DOSS.pushed = true; clearTimeout(hashT); history.pushState(null,'',hashStr()) } else writeHash()
}
function exitDossier() {   // leave the page view; history is already where it should be
	S.doss = null; $('cols').classList.remove('dossmode'); $('doss').innerHTML = ''
	dirtyAll(); reveal(S.sel)
}
function closeDossier() { if (DOSS.pushed) { DOSS.pushed = false; history.back() } else { exitDossier(); writeHash() } }
addEventListener('popstate', () => {
	const P = new URLSearchParams(location.search), d = P.get('s')
	if (d && SPACES.includes(d)) { if (S.doss !== d) openDossier(d, false) }
	else if (S.doss) exitDossier()
})

// ── chrome: collections rail (favorites + purpose facets), filter row, toolbar ──
const PLABEL = { print: 'Print & surface' }   // the tag's tip has always meant inks, paints AND atlases — the label now says so
function paintSide() {
	const b = (on,attr,label,count) => `<button class="${on?'on':''}" ${attr} aria-pressed="${on}"><span class="n">${label}</span>${count!=null?`<span class="c tnum">${count}</span>`:''}</button>`
	$('side').innerHTML = `
		${b(!S.purposes.size && !S.favsOnly && !S.family,'data-all','All spaces',SPACES.length)}
		${b(S.favsOnly,'data-favs','<span class="fs">★</span> Favorites',S.favs.size)}
		<h2>Families</h2>${LINEAGE.map(c => b(S.family === c.name,`data-fam="${c.name}" title="${c.tip||''}"`,c.name,c.spaces.length)).join('')}
		<h2>Tags</h2><div class="tcloud">${ORDER.map(t => `<button class="${S.purposes.has(t)?'on':''}" data-p="${t}" aria-pressed="${S.purposes.has(t)}" title="${TIPS[t]} (${PCOUNT[t]})">${PLABEL[t] || t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`
}
function paintFacets() {
	$('scope').innerHTML = FDEF.map(([k,label,opts]) => {
		const shown = opts.filter(([v]) => k !== 'avail' || !['gl','wasm'].includes(v) || capSets[v].size)
		return `<label class="fsel"><span>${label}</span><select data-fk="${k}" class="${F[k]?'on':''}" aria-label="${label} filter">
			<option value="">Any</option>${shown.map(([v,l]) => `<option value="${v}"${F[k]===v?' selected':''}>${l}</option>`).join('')}</select></label>`
	}).join('') +
	`<span class="sp"></span><label class="fsel"><span>Sort</span><select id="sort" aria-label="Order within families">
		<option value="popular"${S.sort==='popular'?' selected':''}>Popularity</option>
		<option value="era"${S.sort==='era'?' selected':''}>Era</option>
		<option value="name"${S.sort==='name'?' selected':''}>Name</option></select></label>`
	$('sort').onchange = e => { S.sort = e.target.value; localStorage.altSort = S.sort; render() }
}
$('scope').addEventListener('change', e => { const k = e.target.dataset.fk; if (!k) return
	F[k] = e.target.value; render(); $('scroll').scrollTop = 0 })

// ── render & repaint ──
const paintEnt = el => el.classList.contains('card') ? paintCard(el) : paintRow(el)
const viewEl = () => $(S.view === 'tbl' ? 'tblw' : S.view)
function render() {
	const L = shown(), G = grouped(L)
	RENDER.flat = G.flatMap(g => g.spaces)
	$('count').textContent = `${L.length} space${L.length===1?'':'s'}${L.length!==SPACES.length?` of ${SPACES.length}`:''}`
	;['gal','list','tblw','empty'].forEach(id => $(id).hidden = true)
	if (!L.length) { $('empty').hidden = false; $('empty').innerHTML = `<b>No matching color spaces</b><span>Clear search and filters to return to the full catalogue.</span><button type="button">Show all</button>` }
	else if (S.view === 'gal') { $('gal').hidden = false
		$('gal').innerHTML = G.map(g => `<h3 class="gsec"${g.tip?` title="${g.tip}"`:''}>${g.name}<i class="tnum">${g.spaces.length}</i></h3><div class="ggrid">${g.spaces.map((sp,i2) => cardHTML(sp, i2+1)).join('')}</div>`).join('')
		$('gal').querySelectorAll('.card').forEach(el => io.observe(el)) }
	else if (S.view === 'list') { $('list').hidden = false
		$('list').innerHTML = G.map(g => `<h3 class="gsec"${g.tip?` title="${g.tip}"`:''}>${g.name}<i class="tnum">${g.spaces.length}</i></h3>${g.spaces.map((sp,i2) => rowHTML(sp, i2+1)).join('')}`).join('')
		$('list').querySelectorAll('.row').forEach(el => io.observe(el)) }
	else { $('tblw').hidden = false; $('tblw').innerHTML = tblHTML(G); paintTbl() }
	paintSide(); paintFacets(); paintCur(); paintInsp()
	;['v-gal','v-list','v-tbl'].forEach(id => $(id).setAttribute('aria-pressed',id === 'v-' + S.view))
	;[['q-smooth','smooth'],['q-steps','steps'],['q-web','web']].forEach(([id,v]) => $(id).setAttribute('aria-pressed', S.quant === v))
	writeHash()
}
let raf = 0
function dirtyAll() {   // color changed: repaint what's on screen this frame, the rest re-primes lazily
	if (raf) return
	raf = requestAnimationFrame(() => { raf = 0
		const vh = innerHeight, pad = vh/3
		document.querySelectorAll('.card, .row').forEach(el => {
			const r = el.getBoundingClientRect()
			if (r.bottom > -pad && r.top < vh + pad) paintEnt(el); else io.observe(el) })
		if (!$('tblw').hidden) paintTbl()
		paintCur(); paintInsp(); if (S.doss) paintDoss(); writeHash()
	})
}
function paintCur() { const h = cssHex(), tki = ink(S.rgb), root = document.documentElement
	root.style.setProperty('--cur',h); root.style.setProperty('--tkc',h)
	root.style.setProperty('--tki',tki); root.style.setProperty('--tkv',tki === '#fff' ? 'var(--dark)' : '#fff')   // the tick's ring pair: the fill's own ink, and its inverse on engagement
	$('csw').style.background = h; $('cpick').value = h
	if (document.activeElement !== $('chex')) $('chex').value = h
}

// ── wiring ──
const setInspector = on => { S.insp = on; $('cols').classList.toggle('insp',on) }   // narrow-screen overlay only — at full width the record is always present
function setHexError(on) { $('chex').toggleAttribute('aria-invalid',on); $('curmsg').hidden = !on }
const resetFilters = () => { S.purposes.clear(); S.favsOnly = false; for (const [k] of FDEF) F[k] = ''; S.q = ''; $('q').value = ''; $('findw').classList.remove('has'); render() }
function reveal(s) { const el = document.querySelector(`.card[data-s="${CSS.escape(s)}"], .row[data-s="${CSS.escape(s)}"], tr.sr[data-s="${CSS.escape(s)}"]`)
	el?.scrollIntoView({ block:'nearest' }) }

const setView = view => { S.view = view; localStorage.altView = view; render(); $('scroll').scrollTop = 0
	const el = viewEl(); el.classList.remove('vin'); void el.offsetWidth; el.classList.add('vin') }   // entrance replayed by the switch, never by filtering
$('v-gal').onclick = () => setView('gal')
$('v-list').onclick = () => setView('list')
$('v-tbl').onclick = () => setView('tbl')
$('zoom').oninput = e => { S.z = +e.target.value; document.documentElement.style.setProperty('--zoom',S.z)
	document.body.classList.toggle('zoomed',S.z > .55); document.body.classList.toggle('zmin',S.z < .18) }
$('zoom').oninput({ target:$('zoom') })
;[['q-smooth','smooth'],['q-steps','steps'],['q-web','web']].forEach(([id,v]) => $(id).onclick = () => {
	S.quant = v; localStorage.altQuant = v
	document.querySelectorAll('.plbox canvas, .plwrap canvas').forEach(cv => delete cv.dataset.k)
	render(); if (S.doss) paintDoss() })
$('q').oninput = e => { S.q = e.target.value.trim(); $('findw').classList.toggle('has',!!S.q); render() }
$('qx').onclick = () => { S.q = ''; $('q').value = ''; $('findw').classList.remove('has'); render(); $('q').focus() }
$('empty').onclick = e => { if (e.target.closest('button')) resetFilters() }
$('cpick').oninput = e => { const h = e.target.value; setColor('rgb',[1,3,5].map(i => parseInt(h.slice(i,i+2),16))) }
$('chex').oninput = e => { if (/^#?[0-9a-f]{6}$/i.test(e.target.value.trim())) setHexError(false) }
$('chex').onchange = e => { const m = e.target.value.trim().match(/^#?([0-9a-f]{6})$/i)
	if (m) setColor('rgb',[0,2,4].map(i => parseInt(m[1].slice(i,i+2),16))); else setHexError(true) }

const SUN='<svg width="14" height="14" viewBox="1 1 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>'
const MOON='<svg width="13" height="13" viewBox="2 2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>'
const drawTheme = () => { const dark = document.documentElement.dataset.theme === 'dark'; $('thm').innerHTML = dark ? SUN : MOON; $('thm').setAttribute('aria-pressed',dark); $('thm').setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme') }
$('thm').onclick = () => { const flip = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'
		document.documentElement.dataset.theme = t; localStorage.csTheme = t; drawTheme(); if (S.doss) paintDoss() }
	// ease the brightness jump when the platform can cross-fade it
	if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) document.startViewTransition(flip); else flip() }

$('side').onclick = e => { const b = e.target.closest('button'); if (!b) return
	if ('all' in b.dataset) { S.purposes.clear(); S.favsOnly = false; S.family = null }
	else if ('favs' in b.dataset) S.favsOnly = !S.favsOnly
	else if (b.dataset.fam) S.family = S.family === b.dataset.fam ? null : b.dataset.fam
	else if (b.dataset.p) S.purposes[S.purposes.has(b.dataset.p)?'delete':'add'](b.dataset.p)
	else return
	render(); $('scroll').scrollTop = 0 }

// selection + face paging + dossier — one delegated listener per view.
// Selecting changes no color: touch only the selection dress and the record, never the specimens.
function select(s) { if (S.sel === s) return; S.sel = s; localStorage.altSel = s; delete $('insp').dataset.s
	document.querySelectorAll('.card.on,.row.on,tr.sr.on').forEach(el => { el.classList.remove('on')
		el.querySelector('.nm,.trpick')?.setAttribute('aria-pressed','false') })
	document.querySelectorAll(`[data-s="${CSS.escape(s)}"]`).forEach(el => { if (el.matches('.card,.row,tr.sr')) { el.classList.add('on')
		el.querySelector('.nm,.trpick')?.setAttribute('aria-pressed','true') } })
	paintInsp(); writeHash() }
$('gal').onclick = e => { const card = e.target.closest('.card'); if (!card) return
	const s = card.dataset.s; select(s)
	if (e.target.closest('.nm') && !WIDE.matches) setInspector(true)   // the name is the door to the record where it isn't already open
	const pv = e.target.closest('.pv'), nx = e.target.closest('.nx'), FACES = 2   // sliders · plane (a 3D solid face would slot in here)
	if (pv || nx) { S.faces[s] = ((S.faces[s]||0)+(nx?1:FACES-1))%FACES; paintCard(card)
		const f = card.querySelector('.face'); f.classList.remove('fin'); void f.offsetWidth; f.classList.add('fin') } }
$('gal').addEventListener('dblclick', e => { const card = e.target.closest('.card'); if (!card) return
	if (e.target.closest('.nch, .pg, button, .cv')) return   // strips pass through — a double-click on the specimen IS the door to the dossier
	e.preventDefault(); openDossier(card.dataset.s) })
$('list').onclick = e => { const row = e.target.closest('.row'); if (!row) return
	const s = row.dataset.s; select(s)
	if (e.target.closest('.hd')) { row.classList.toggle('open'); S.open[row.classList.contains('open')?'add':'delete'](s); paintRow(row) } }
$('list').addEventListener('dblclick', e => { const row = e.target.closest('.row'); if (!row) return
	if (e.target.closest('input,.cv')) return
	e.preventDefault(); openDossier(row.dataset.s) })
$('tblw').onclick = e => {
	const cfg = e.target.closest('#cfg'); if (cfg) { const b = e.target.closest('button'); if (b) { cfg.classList.toggle('open'); b.setAttribute('aria-expanded',cfg.classList.contains('open')) } return }
	const th = e.target.closest('th[data-k]'); if (th) { S.sort = th.dataset.k === 'year' ? 'era' : 'name'; localStorage.altSort = S.sort; render(); return }
	const tr = e.target.closest('tr.sr'); if (!tr) return
	const s = tr.dataset.s; select(s)
	if (e.target.closest('.trpick') && !e.target.closest('.dis') && !WIDE.matches && e.detail !== 2) setInspector(true)
	if (e.target.closest('.dis')) { S.open[S.open.has(s)?'delete':'add'](s); render() }
	else if (e.detail === 2) openDossier(s) }
$('tblw').onchange = e => { const k = e.target.dataset.k; if (!k) return; S.cols[e.target.checked?'add':'delete'](k); render() }

// live channel editing — sliders and value fields in gallery tiles, list rows, the inspector, and the dossier
function onEdit(host,sOf) { host.addEventListener('input',e => {
	const t = e.target; if (t.type !== 'range' && !t.classList.contains('cv')) return
	const chl = t.closest('.ch,.st,.nv'); if (!chl) return
	const s = sOf(t), i = +chl.dataset.i, vals = (V.get(s)||valsOf(s)).slice(), parsed = parseFloat(t.value)
	if (!isFinite(parsed)) return; if (S.sel !== s) select(s)
	const c = meta[s].channels[i]; vals[i] = clamp(parsed,c.min,c.max); setColor(s,vals) }) }
onEdit($('gal'),t => t.closest('.card').dataset.s)
onEdit($('list'),t => t.closest('.row').dataset.s)
onEdit($('insp'),() => S.sel)
onEdit($('doss'),() => S.doss)
wirePlane($('gal'),cv => cv.closest('.card').dataset.s)
wirePlane($('insp'),() => S.sel)
wirePlane($('doss'),() => S.doss)
$('insp').addEventListener('click',e => {
	if (e.target.closest('.iclose')) { setInspector(false); return }
	const st = e.target.closest('.star'); if (st) { toggleFav(S.sel, st); return }
	const rl = e.target.closest('[data-rel]'); if (rl) { select(rl.dataset.rel); reveal(rl.dataset.rel); return }
	const b = e.target.closest('.vseg button'); if (b && !b.disabled) { IVIEW.v = b.dataset.v; paintInsp() } })
function toggleFav(s, btn) { S.favs[S.favs.has(s)?'delete':'add'](s); localStorage.altFavs = JSON.stringify([...S.favs])
	btn?.setAttribute('aria-pressed',S.favs.has(s)); paintSide(); if (S.favsOnly && !S.doss) render() }
$('doss').addEventListener('click',e => {
	if (e.target.closest('#dback')) { closeDossier(); return }
	const st = e.target.closest('.star'); if (st) { toggleFav(S.doss, st); return }
	const rl = e.target.closest('[data-rel]'); if (rl) { openDossier(rl.dataset.rel, false); clearTimeout(hashT); history.replaceState(null,'',hashStr()); return }
	const ax = e.target.closest('.axes button'); if (ax) { DOSS.axes = ax.dataset.ax.split(',').map(Number); paintDoss() } })
// the solid is in the hand: drag rotates the hull
$('doss').addEventListener('pointerdown',e => { const cv = e.target.closest('.d3d canvas'); if (!cv) return
	e.preventDefault(); cv.setPointerCapture(e.pointerId)
	let lx = e.clientX, ly = e.clientY
	const mv = ev => { DOSS.rot[0] += (ev.clientX - lx) * .011; DOSS.rot[1] = clamp(DOSS.rot[1] - (ev.clientY - ly) * .011, -Math.PI/2, Math.PI/2)
		lx = ev.clientX; ly = ev.clientY; drawHull(cv, S.doss) }
	cv.addEventListener('pointermove',mv)
	cv.addEventListener('pointerup',() => cv.removeEventListener('pointermove',mv),{ once:true }) })
// the record's width is a grab: drag the inspector's left edge at full width
$('insp').addEventListener('pointerdown',e => { const h = e.target.closest('.rsz'); if (!h || !WIDE.matches) return
	e.preventDefault(); h.classList.add('drag')
	const move = ev => { const w = clamp(window.innerWidth - ev.clientX, 300, 560)
		document.documentElement.style.setProperty('--inspw', w + 'px') }
	const up = () => { removeEventListener('pointermove',move); removeEventListener('pointerup',up); h.classList.remove('drag')
		localStorage.altInspW = document.documentElement.style.getPropertyValue('--inspw') }
	addEventListener('pointermove',move); addEventListener('pointerup',up) })
$('insp').addEventListener('dblclick',e => { if (!e.target.closest('.rsz')) return
	document.documentElement.style.removeProperty('--inspw'); delete localStorage.altInspW })
document.addEventListener('click',e => { const c = document.querySelector('.cfg.open'); if (c && !e.target.closest('.cfg')) { c.classList.remove('open'); c.querySelector('button')?.setAttribute('aria-expanded','false') } })

// ── keyboard: arrows walk the shelves (or leaf through dossiers), Enter/Space discloses, Escape unwinds ──
const colsOf = () => { const g = document.querySelector('.ggrid'); return g ? getComputedStyle(g).gridTemplateColumns.split(' ').length : 1 }
document.addEventListener('keydown',e => {
	if (e.key === 'Escape') {
		const c = document.querySelector('.cfg.open'); if (c) { c.classList.remove('open'); c.querySelector('button')?.setAttribute('aria-expanded','false'); return }
		if (S.doss) { closeDossier(); return }
		if (S.insp && !WIDE.matches) setInspector(false)
		return }
	if (e.target.closest('input,select,textarea,[contenteditable]')) return
	const flat = RENDER.flat; if (!flat.length) return
	if (S.doss) {   // in the dossier, ← → leaf through neighbouring spaces
		if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return
		e.preventDefault()
		let i = flat.indexOf(S.doss); if (i < 0) i = 0
		i = clamp(i + (e.key === 'ArrowRight' ? 1 : -1), 0, flat.length - 1)
		if (flat[i] !== S.doss) { openDossier(flat[i], false); clearTimeout(hashT); history.replaceState(null,'',hashStr()) }
		return }
	let i = flat.indexOf(S.sel); if (i < 0) i = 0
	const step = S.view === 'gal' ? colsOf() : 1
	if (e.key === 'ArrowLeft') i--
	else if (e.key === 'ArrowRight') i++
	else if (e.key === 'ArrowUp') i -= step
	else if (e.key === 'ArrowDown') i += step
	else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault()
		if (S.view === 'gal') openDossier(S.sel)
		else if (S.view === 'list') { const row = document.querySelector(`.row[data-s="${CSS.escape(S.sel)}"]`)
			if (row) { row.classList.toggle('open'); S.open[row.classList.contains('open')?'add':'delete'](S.sel); paintRow(row) } }
		else { S.open[S.open.has(S.sel)?'delete':'add'](S.sel); render() }
		return }
	else return
	e.preventDefault()
	i = clamp(i, 0, flat.length - 1)
	if (flat[i] !== S.sel) { select(flat[i]); reveal(flat[i]) }
})

if (localStorage.altInspW) document.documentElement.style.setProperty('--inspw', localStorage.altInspW)
if (S.q) { $('q').value = S.q; $('findw').classList.add('has') }
drawTheme(); render(); requestAnimationFrame(() => $('cols').classList.add('ready'))
if (SPACES.includes(H0.get('s'))) openDossier(H0.get('s'), false)   // deep-linked dossier (the main site's ?s= slug): no push, Back leaves the site as it should
</script>
</body>
