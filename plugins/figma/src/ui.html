<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Color Space</title>
<style>
/* Colors come from Figma's theme tokens (showUI themeColors: true), so the panel follows
   Figma's light and dark themes. Outside Figma, such as in scripts/check-figma.js, they
   fall back to CSS system colors. Spacing, type and picker tokens are the atlas's own,
   copied from web/tokens.css at build time; the picker's rules mirror the dossier's
   (web/index.html .pl, .pmode, .bar2, .nrg, #tip). Layout and shapes follow Figma's own
   color picker: the plane, the eyedropper beside the sliders, the format select beside one
   row of values; filled fields, pill tracks, round knobs in a white ring. */
:root{
	color-scheme:light dark;
	--paper:var(--figma-color-bg, Canvas);
	--panel:var(--figma-color-bg-secondary, color-mix(in oklab, CanvasText 7%, Canvas));
	--ink:var(--figma-color-text, CanvasText);
	--soft:var(--figma-color-text-secondary, GrayText);
	--hair:var(--figma-color-border, GrayText);
	--sel:var(--figma-color-border-selected, Highlight);
	--edge:color-mix(in oklab, var(--ink) 12%, transparent);   /* the hairline inside a field, as Figma draws its plane and tracks */
	/* the handles: the current color (--tkc, stamped on #picker) in a white ring, as Figma draws them – measured on its
	   picker at 2×: 16 px across (its track's height), a 4 px white ring, the color's own 1 px darker rim inside it, a
	   1 px 20% outline and a soft drop shadow outside */
	--tkc:transparent;
	--knob:var(--s4);
	--knob-ring:var(--s1) solid #fff;
	--knob-edge:inset 0 0 0 var(--rule-hair) color-mix(in oklab, #000 20%, transparent), 0 0 0 var(--rule-hair) color-mix(in oklab, #000 20%, transparent), 0 .0625rem .1875rem color-mix(in oklab, #000 15%, transparent);
	--track:var(--s4);
	--field-radius:var(--radius-card);
/*TOKENS*/
}
/*ICONFONT*/
*{ box-sizing:border-box }
/* the window follows the content; if it ever can't, it scrolls without a scrollbar taking width from the layout */
html{ overflow-y:auto; scrollbar-width:none }
html::-webkit-scrollbar{ display:none }
/* a drag hides the cursor, as Figma's own picker does: the knob is where the pointer is */
html.drag,html.drag *{ cursor:none !important }
body{ margin:0; padding:var(--s3); background:var(--paper); color:var(--ink); font:var(--text-xs)/1.45 var(--font-current) }
:focus-visible{ outline:calc(var(--rule-hair)*2) solid var(--ink); outline-offset:var(--space-3xs) }   /* the atlas's focus ring (web/workshop.css) */
[hidden]{ display:none !important }
button,select,input{ font:inherit; color:inherit }
.fi{ flex:none; width:var(--ic,14px); height:var(--ic,14px) }
.ic{ flex:none; width:var(--ic,14px); height:var(--ic,14px); fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round }

/* Figma's field: filled, a hairline on hover, the selection color on focus */
.fld{ height:var(--s6); background:var(--panel); border:var(--rule-hair) solid transparent; border-radius:var(--field-radius); padding:0 var(--s2); min-width:0 }
.fld:hover{ border-color:var(--hair) }
.fld:focus-within{ border-color:var(--sel) }
.fld input{ width:100%; height:100%; min-width:0; padding:0; border:0; background:none; outline:none }
.fld input[readonly]{ color:var(--soft) }
/* Figma's select: an outlined box on the panel, its chevron at the right */
.sel{ position:relative; display:flex; align-items:center; gap:var(--s1); height:var(--s6); min-width:0; padding:0 var(--s2); border:var(--rule-hair) solid var(--hair); border-radius:var(--field-radius); background:var(--paper); color:var(--ink); cursor:pointer; text-align:start }
.sel:hover{ border-color:var(--soft) }
.sel:focus-within,.sel:focus-visible{ border-color:var(--sel); outline:none }
.sel .chev{ margin-left:auto; --ic:10px; color:var(--soft); pointer-events:none; flex:none }

/* the top row: the space (a menu with search and folding families, opened in the page), then the Quantize and the
   Limit lens. Every control is clickable over its whole face, chevron included, and keeps its width. */
.top{ position:relative; display:flex; align-items:center; gap:var(--s1) }
.top .spb{ flex:1; justify-content:space-between }
#spname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.lens{ flex:none; width:2.75rem; padding:0; line-height:1 }
.lens .face{ position:absolute; left:var(--s2); font:var(--t3)/1 'color-space icons'; color:var(--soft); pointer-events:none }
.lens > .chev{ position:absolute; right:var(--s1) }
.lens:hover .face{ color:var(--ink) }
/* an OS-drawn list ignores web fonts: there the native select lies transparent over the face, its options showing the
   icons' look-alike Unicode symbols */
.lens select{ position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer }
.lens select > button{ display:none }
/* where the select is customizable (Chromium 135+) the page draws it: the closed control shows the current option's
   icon, the list every icon in the icon font beside its name; these lists are short enough to open inside the frame */
@supports (appearance: base-select) {
	.lens .face,.lens > .chev{ display:none }
	.lens select,.lens ::picker(select){ appearance:base-select }
	.lens select{ opacity:1; padding:0; border:0; background:none; color:var(--soft); font:inherit }
	.lens select:hover{ color:var(--ink) }
	.lens select::picker-icon{ display:none }
	.lens select > button{ display:flex; align-items:center; justify-content:space-between; width:100%; height:100%; padding:0 var(--s1) 0 var(--s2); border:0; background:none; color:inherit; font:inherit; cursor:pointer }
	.lens selectedcontent{ display:flex; align-items:center }
	.lens selectedcontent .nm{ display:none }
	.lens .ico{ font:var(--t3)/1 'color-space icons'; width:1.2em; text-align:center }
	.lens ::picker(select){ position-area:bottom span-left; position-try-fallbacks:flip-block; width:10.5rem; margin:var(--s1) 0; padding:var(--s1); border:var(--rule-hair) solid var(--hair); border-radius:var(--radius-card); background:var(--paper); color:var(--ink); box-shadow:var(--modal-shadow) }
	.lens option{ display:flex; align-items:center; gap:var(--s2); padding:var(--s1) var(--s2); border-radius:var(--radius-control); font-size:var(--t1); color:var(--soft); white-space:nowrap }
	.lens option:hover,.lens option:focus-visible{ background:var(--panel); color:var(--ink); outline:none }
	.lens option:checked{ color:var(--ink) }
	.lens option::checkmark{ order:1; margin-inline-start:auto; padding-inline-start:var(--s2) }
	/* a group's label on the list's rhythm: a row's padding around it, and a row's gap before the second group */
	.lens legend{ padding:var(--s1) var(--s2); font-size:var(--t0); font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--soft) }
	.lens optgroup + optgroup legend{ margin-top:var(--s2) }
}
/* the space menu: a search, then the featured spaces and the families as folding sections (the current space's family
   open); under a search every section opens to its matches. In the page, under its button; the window grows to hold it */
.spmenu{ position:absolute; z-index:10; top:calc(100% + var(--s1)); left:0; right:0; display:flex; flex-direction:column; max-height:22rem; border:var(--rule-hair) solid var(--hair); border-radius:var(--radius-card); background:var(--paper); color:var(--ink); box-shadow:var(--modal-shadow); overflow:hidden }
.sphead{ padding:var(--s2); border-bottom:var(--rule-hair) solid var(--hair) }
.srch{ display:flex; align-items:center; gap:var(--s1) }
.srch .ic{ --ic:12px; color:var(--soft) }
.srch input{ flex:1 }
.splist{ overflow:auto; padding:var(--s1) 0 }
.fam{ display:flex; align-items:center; gap:var(--s1); width:100%; padding:var(--s1) var(--s2); border:0; background:none; color:var(--soft); font-size:var(--t0); font-weight:600; letter-spacing:.04em; text-transform:uppercase; text-align:start; cursor:pointer }
.fam:hover,.fam:focus-visible{ color:var(--ink) }
.fam .chev{ --ic:10px; transform:rotate(-90deg); transition:transform var(--dur-micro) var(--ease-out) }
.fam[aria-expanded="true"] .chev{ transform:none }
.fam .n{ margin-inline-start:auto; font-weight:400; letter-spacing:0 }
.spo{ display:grid; grid-template-columns:var(--s3) minmax(0,1fr) auto; align-items:center; gap:var(--s1); width:100%; padding:var(--s1) var(--s2) var(--s1) var(--s4); border:0; background:none; color:var(--ink); font-size:var(--t1); text-align:start; cursor:pointer }
.spo .nm{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.spo .id{ color:var(--soft); font-family:var(--font-mono); font-size:var(--t0); white-space:nowrap }
.spo.feat .nm{ font-weight:700 }
.spo[aria-selected="true"]::before{ content:''; width:.35rem; height:.6rem; margin-left:.1rem; border:solid currentColor; border-width:0 .125rem .125rem 0; transform:rotate(45deg) translate(-.05rem,-.1rem) }
.spo:not([aria-selected="true"])::before{ content:'' }
.spo.on,.spo:hover{ background:var(--panel) }
.spnone{ margin:0; padding:var(--s2) var(--s3); color:var(--soft) }

/* a value cell, Figma's: filled, the channel letter inside at its left (drag it to scrub, as in Figma) */
.cvp{ display:flex; align-items:center; gap:var(--space-3xs); height:var(--s6); min-width:0; padding:0 var(--s1) 0 var(--s2); background:var(--panel); border:var(--rule-hair) solid transparent; border-radius:var(--field-radius) }
.cvp:hover{ border-color:var(--hair) }
.cvp:focus-within{ border-color:var(--sel) }
.cl{ font-style:normal; font-weight:600; color:var(--soft); cursor:ew-resize; touch-action:none; user-select:none; white-space:nowrap }
.cvp.locked .cl{ cursor:default }
.cv{ width:100%; min-width:0; height:100%; padding:0; border:0; background:none; outline:none; font-variant-numeric:tabular-nums; text-align:end }
.cv[readonly]{ color:var(--soft) }
.cv::-webkit-inner-spin-button,.cv::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0 }
.cv{ -moz-appearance:textfield; appearance:textfield }

.icb{ display:grid; place-items:center; width:var(--s6); height:var(--s6); padding:0; border:0; border-radius:var(--field-radius); background:none; color:var(--soft); cursor:pointer }
.icb:hover,.icb:focus-visible{ color:var(--ink); background:var(--panel) }   /* dim → ink, the atlas's hover idiom */

/* the layers, as Figma lists them: full-width rows, the selected one tinted with the selection color */
.empty{ color:var(--soft); margin:0 0 var(--s3) }
.paints{ list-style:none; margin:0 0 var(--s3); padding:0; max-height:calc(4 * var(--s6)); overflow:auto }
.paint{ display:grid; grid-template-columns:var(--s3) minmax(0,1fr) auto; align-items:center; gap:var(--s2); width:100%; height:var(--s6); padding:0 var(--s2); background:none; border:0; border-radius:var(--field-radius); text-align:start; color:var(--ink); cursor:pointer }
.paint:hover{ background:color-mix(in oklab, var(--panel) 60%, transparent) }
.paint[aria-pressed="true"]{ background:var(--panel) }   /* selected, not focused: Figma's quiet fill, not its blue */
.paint:focus-visible{ outline-offset:calc(var(--rule-hair)*-2) }   /* the ring drawn inside: the scrolling list would clip it outside */
.sw{ width:var(--s3); height:var(--s3); border:var(--rule-hair) solid var(--edge); border-radius:var(--radius-control) }
.pn,.src{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.src{ max-width:9rem; color:var(--soft) }

/* ── the picker: the plane, the sliders, the values ── */
.picker{ display:flex; flex-direction:column; gap:var(--s2); margin-bottom:var(--s2) }
/* the plane: two channels swept, the rest held; past the file's gamut it ghosts, where no color exists it voids to the checker */
.pl{ position:relative; width:100%; aspect-ratio:1; cursor:crosshair; touch-action:none; user-select:none; background:var(--checker); border-radius:var(--field-radius) }
.pl::after,.bar2::after{ content:''; position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 0 0 var(--rule-hair) var(--edge); pointer-events:none }
.pl canvas{ display:block; width:100%; height:100%; border-radius:var(--field-radius) }
/* an image's pixels as dots over the field: where its colors sit in this slice of the space */
.pl canvas.density{ position:absolute; inset:0; pointer-events:none }
.pl.polar{ background:none }
.pl.polar::after{ border-radius:50% }
.pl.polar canvas:not(.density){ background:var(--checker); border-radius:50% }   /* the disc's backdrop – never the dots' layer, which would cover the field */
/* over the plane (not inside the slider): the axis letters, set as on the dossier's planes and inked for the field beneath;
   a letter is a button – a click swaps that axis for the channel held. In the corner, the wheel/square switch (the site's .pmode) */
.axes{ position:absolute; inset:0; pointer-events:none }
.axes button{ position:absolute; pointer-events:auto; padding:var(--space-3xs) var(--s1); border:0; border-radius:var(--radius-control); background:none; font-size:var(--t0); font-weight:700; cursor:pointer }
.axes button:hover,.axes button:focus-visible{ background:color-mix(in oklab, var(--paper) 70%, transparent); color:var(--ink) !important }
.axes .laby{ top:var(--space-3xs); left:var(--space-3xs) }
.axes .labx{ right:var(--space-3xs); bottom:var(--space-3xs) }
.axes .pmode{ left:var(--space-3xs); bottom:var(--space-3xs); display:grid; place-items:center; width:var(--s5); height:var(--s5); padding:0; color:var(--soft) }
.axes .pmode::before{ content:''; width:.6rem; height:.6rem; border:var(--rule-hair) solid currentColor; border-radius:50% }   /* a circle: the wheel */
.axes .pmode[aria-pressed="true"]::before{ border-radius:0 }   /* in the wheel, the square: back to the plane */
/* the marker: the current color in Figma's white ring */
.pl .cx{ position:absolute; z-index:3; width:var(--knob); height:var(--knob); transform:translate(-50%,-50%); border-radius:50%; background:var(--tkc); border:var(--knob-ring); box-shadow:var(--knob-edge); pointer-events:none }
.pl.locked{ cursor:default }
/* the document's colors: small rings where each sits on this plane, over it (not inside the slider); a click takes it */
.plw{ position:relative }
.plw:has(.pl[hidden]){ display:none }
.marks{ position:absolute; inset:0; pointer-events:none }
.marks .dm{ pointer-events:auto; position:absolute; z-index:2; width:.375rem; height:.375rem; padding:0; transform:translate(-50%,-50%); border-radius:50%; border:0; box-shadow:0 0 0 var(--rule-hair) color-mix(in oklab, #fff 70%, transparent); opacity:.55; cursor:pointer }   /* a reference, not a handle: a faint dot */
.marks .dm:hover,.marks .dm:focus-visible{ opacity:1 }
.marks .links{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none }
.marks .links polyline{ fill:none; stroke:color-mix(in oklab, #fff 70%, transparent); stroke-width:var(--rule-hair); vector-effect:non-scaling-stroke }   /* a gradient's path through its stops: a soft white line */

/* the sliders, the eyedropper beside them as in Figma; each row's value cell at its right */
.sliders{ display:grid; grid-template-columns:auto minmax(0,1fr); align-items:center; gap:var(--s2) }
.sliders .icb[hidden] + .bars{ grid-column:1 / -1 }
.bars{ display:grid; grid-template-columns:minmax(0,1fr) 4.5rem; align-items:center; gap:var(--s1) var(--s2); margin:0; padding:0; border:0 }   /* a 4 px row gap: track to track (24 − 16 + 4) equals the plane to the first track (8 + 4) */
/* a bar: the channel swept with the others held, on the same kernel as the plane; its knob (role slider) rides inside the pill, as on Figma's sliders */
.bar2{ position:relative; height:var(--track); cursor:ew-resize; touch-action:none; user-select:none; background:var(--checker); border-radius:var(--track) }   /* Figma's pill track */
.bar2 .bgc{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; border-radius:var(--track) }
.bar2 .nrg{ position:absolute; z-index:1; top:50%; left:calc(var(--knob) / 2 + var(--f, 0) * (100% - var(--knob))); width:var(--knob); height:var(--knob); transform:translate(-50%,-50%); border-radius:50%; background:var(--tkc); border:var(--knob-ring); box-shadow:var(--knob-edge) }
.bar2 .nrg:focus-visible{ outline-offset:var(--space-3xs) }
.bar2:has(.nrg[aria-disabled="true"]){ cursor:default }
/* the opacity bar, Figma's: the current color over the checker, clear to solid across the knob's travel */
.bar2.alpha{ background:linear-gradient(90deg, transparent calc(var(--knob) / 2), var(--tkc) calc(100% - var(--knob) / 2)), var(--checker) }

/* the gamut status: always one line, so it never moves anything as a drag crosses the gamut */
.status{ display:flex; align-items:flex-start; gap:var(--s2); margin:var(--s2) 0 0; color:var(--soft) }
.gamut{ flex:1; min-width:0; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }   /* one line, its words short enough to fit; the detail rides the tooltip */
.gamut.out{ color:var(--ink) }
.status .prof{ flex:none; cursor:help }   /* the file's color profile, said once, quietly */
.notes{ color:var(--soft); margin:var(--s1) 0 0 }
.notes:empty{ margin:0 }   /* the live region stays in the page, empty, so its first note is announced */
.notes p{ margin:0 0 var(--s1) }

.css{ display:grid; gap:var(--s1) }
.row{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:var(--s1) }
.row input{ font-family:var(--font-mono) }
.row .icb[aria-label="Copied"],.row .icb[aria-label="Selected"]{ color:var(--ink) }   /* the copy glyph (the site footer's), lit while it confirms */

/* the width grip: the panel's right edge, dragged to widen it (the plane grows with it) */
.grip{ position:fixed; top:0; right:0; bottom:0; width:var(--s1); cursor:ew-resize; touch-action:none }
.grip:hover,.grip:focus-visible,html.drag .grip.live{ background:color-mix(in oklab, var(--sel) 35%, transparent); outline:none }

/* the atlas's themed tooltip (web/js/tip.js): Figma's frame shows no native title */
/* secondary: small; it goes when the pointer leaves its element or the panel, on any press, and when Figma takes focus */
#tip{ position:fixed; left:0; top:0; z-index:var(--z-tooltip); max-width:12rem; padding:var(--space-3xs) var(--s1); font-size:var(--t0); font-weight:500; line-height:1.35; white-space:pre-line; background:var(--ink); color:var(--paper); border-radius:var(--radius-control); pointer-events:none; opacity:0; transition:opacity var(--dur-micro) var(--ease-out) }
#tip.on{ opacity:.92 }
html.drag #tip{ display:none }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="vq-smooth" x1="0" x2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".15"/><stop offset="1" stop-color="currentColor"/></linearGradient></defs></svg>
<ul class="paints" id="paints" aria-label="Colors in the selection"></ul>
<p class="empty" id="empty">Select a layer with a solid fill, a gradient or an image.</p>
<section class="picker" id="picker" aria-label="Picker">
	<div class="top">
		<button class="sel spb" id="spbtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="spmenu"><span id="spname"></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
		<label class="sel lens" id="quantf"><span class="face" id="quantface"></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><select id="quant" aria-label="Quantize"><button><selectedcontent></selectedcontent><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></select></label>
		<label class="sel lens" id="limitf"><span class="face" id="limitface"></span><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg><select id="limit" aria-label="Limit"><button><selectedcontent></selectedcontent><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></select></label>
		<div class="spmenu" id="spmenu" hidden>
			<div class="sphead"><label class="fld srch"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="spq" type="search" placeholder="Search spaces" aria-label="Search spaces" autocomplete="off" spellcheck="false"></label></div>
			<div class="splist" id="splist" role="listbox" aria-label="Color spaces"></div>
		</div>
	</div>
	<div class="plw"><div class="pl" id="plane" tabindex="0" role="slider"><canvas></canvas><canvas class="density" aria-hidden="true"></canvas><i class="cx"></i></div><div class="marks" id="marks" role="group" aria-label="The document's colors"></div><div class="axes" id="axes"><button class="laby" type="button"></button><button class="labx" type="button"></button><button class="pmode" type="button" hidden></button></div></div>
	<div class="sliders">
		<button class="icb" id="drop" type="button" hidden aria-label="Pick a color from the screen" data-tip="Pick from the screen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg></button>
		<div class="bars" id="channels" role="group" aria-label="Channels"></div>
	</div>
</section>
<section class="css" id="css" aria-label="CSS">
	<div class="row"><label class="fld"><input id="css-1" readonly aria-label="CSS oklch()"></label><button class="icb" type="button" data-copy="css-1" aria-label="Copy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
	<div class="row"><label class="fld"><input id="css-2" readonly aria-label="CSS in the document's RGB"></label><button class="icb" type="button" data-copy="css-2" aria-label="Copy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
	<div class="row" id="named" hidden><label class="fld"><input id="css-3" readonly aria-label="Palette color name"></label><button class="icb" type="button" data-copy="css-3" aria-label="Copy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="1.5"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div>
</section>
<div class="status"><p class="gamut" id="gamut" role="status"></p><span class="prof" id="profile"></span></div>
<div class="notes" id="notes" role="status"></div>
<div class="grip" id="grip" role="separator" aria-orientation="vertical" aria-label="Panel width" aria-valuemin="240" aria-valuemax="560" aria-valuenow="288" tabindex="0" data-tip="Drag to widen"></div>
<script>/*BUNDLE*/</script>
</body>
</html>
